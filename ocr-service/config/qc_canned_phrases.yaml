# Canned / generic commentary phrases that QC flags as not property-specific.
# Editable without code (P-4). Seed list per the agreed approach; expand by
# running the corpus and pulling repeated sentences. Match is case-insensitive
# substring. These are ADVISORY (VERIFY) — a reviewer confirms.
canned_phrases:
  - "typical for the area"
  - "typical for the market"
  - "no adverse conditions noted"
  - "no adverse conditions were noted"
  - "conforms to the neighborhood"
  - "market conditions are stable"
  - "market is stable"
  - "see attached addendum"
  - "see addendum"
  - "see 1004mc"
  - "see the 1004mc"
  - "no further comment"
  - "none noted"
  - "appraiser is not aware of any"
  - "to the best of the appraiser's knowledge"
  - "supply and demand are in balance"
  - "marketing times are typical"

# Terms that must NOT appear in the reconciliation commentary (checklist row 90).
reconciliation_forbidden:
  - "equal weight"
  - "equal consideration"
  - "weighted average"

# A commentary shorter than this many characters is treated as likely incomplete.
min_commentary_chars: 40
