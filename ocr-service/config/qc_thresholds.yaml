# QC rule-engine thresholds. Editable without code changes (P-4).
# Confidence cutoffs: below these, an otherwise PASS/FAIL rule is downgraded to
# VERIFY so a human confirms. Checkbox reads are noisier → higher bar.
confidence:
  structured: 0.75        # addresses, names, numbers, dates
  checkbox: 0.85          # checkbox / enum / boolean fields
  commentary: 0.0         # NLP rules always VERIFY (advisory)

# Fuzzy cross-document match bands (Jaro-Winkler).
match:
  match_threshold: 0.88   # >= → match (PASS)
  review_threshold: 0.75  # [review, match) → VERIFY; < review → mismatch (FAIL)

# Numeric tolerances.
numeric:
  currency_tolerance: 0.0 # exact match after stripping $ and commas

# Per-rule semantic thresholds drawn from the checklist text.
semantic:
  value_vs_contract_pct: 20.0      # appraised value vs contract price hold band
  value_contract_comment_pct: 5.0  # value vs contract price variance requiring commentary (C-1)
  tax_year_window: 2               # tax year must be within N years of the effective date
  tax_amount_max: 100000           # R.E. taxes above this are implausible → VERIFY
  predominant_price_pct: 10.0      # market value vs predominant price comment band
  listing_price_pct: 3.0           # listing vs opinion of value comment band
  net_adjustment_pct: 15.0         # comp net adjustment cap
  gross_adjustment_pct: 25.0       # comp gross adjustment cap (sum of abs line adjustments)
  comp_resale_window_months: 36    # subject/comp prior-sale look-back (resale/flip flag)
  comp_sale_window_months: 12      # comparable sale recency
  remaining_economic_life_min: 30  # FHA/VA minimum years
  depreciation_band_pp: 15.0       # tolerated gap (pp) vs age-life depreciation baseline (CA-3)
  signature_gap_days: 30           # signature more than N days after effective date → VERIFY
  sca2_min_listings: 1            # Champions Funding: "at least 1 current listing and/or pending sale"
  sca2_min_listings_declining: 1  # same threshold under declining-market/over-supply trigger
  sca_br2_min_above: 2            # Champions Funding: min adjusted comps at/above final value
  sca_psh_large_gain_pct: 30.0   # prior-sale value increase % that triggers SCA-PSH escalation
  approach_value_deviation_pct: 10.0  # final value vs developed approach range tolerance (%)

  # ---- Layer-B / Layer-C severity calibration (MIRA three-layer model) -------
  # Judgment rules (adjustments, comp selection, market trend, dated comps) route
  # through app/qc/layer_b.py. When the appraiser's narrative ADDRESSES the concern
  # (Layer B = explained), the finding carries the "explained" confidence; when it
  # does not, it carries the "unexplained" confidence. Lower confidence → the
  # engine softens an asserted finding toward a confirm. Tune here without code.
  layer_b_conf_explained: 0.4    # narrative addresses the concern → low-severity confirm
  layer_b_conf_unexplained: 0.7  # no explanation found → full-severity VERIFY
  approach_value_deviation_pct: 10.0  # final value vs developed approach range tolerance (%)

  # ---- CG-* comparable-grid supplemental rules ----------------------------
  comp_distance_urban_miles: 1.0          # CG-DIST: max distance for Urban area type
  comp_distance_suburban_miles: 5.0       # CG-DIST: max distance for Suburban area type
  comp_distance_rural_miles: 10.0         # CG-DIST: max distance for Rural area type
  comp_prior_sale_window_months: 36       # CG-PRIOR-SALE: look-back window for comp prior sale
  comp_prior_sale_change_pct: 25.0        # CG-PRIOR-SALE: price change % threshold for flag
  comp_time_adj_variance_pct: 50.0        # CG-TIME-CONSIST: max rate variance % before flag
  comp_cond_adj_tolerance: 5000           # CG-COND-CONSIST: dollar tolerance for condition adj consistency

# Subject-section content validation (S-4 / S-5). Editable per experience (P-4).
subject:
  # one-unit land use at/above this % makes an "Under 25%" built-up marking
  # contradictory (N-1 cross-validation)
  builtup_residential_pct: 75
  # Neighborhood names that are technically present but not meaningfully
  # descriptive → VERIFY (a blank/blocked value is a FAIL).
  neighborhood_generic: [residential, suburban, urban, rural, subdivision]
  # APN format patterns by state (regex, full-match). County-level variation is
  # real, so a non-match routes to VERIFY (never FAIL); add states as observed.
  apn_formats:
    TX: '\d{3,5}([-.]\d{2,4}){2,4}'
    CA: '\d{2,4}[-.]\d{2,4}[-.]\d{2,3}'
    FL: '\d{2}[-.]?\d{2}[-.]?\d{2}[-.]?[\dA-Z.-]{4,}'
