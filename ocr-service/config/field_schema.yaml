# =============================================================================
# NORMALIZATIONS — how raw extracted text maps to canonical stored values
# =============================================================================

normalizations:

  state_code:
    description: "2-letter uppercase US state abbreviation"
    transform: uppercase_strip
    reject_if_not_in_allowed_values: true

  zip5:
    description: "5-digit US zip code string"
    transform: digits_only_first5
    pattern: "^\\d{5}$"
    notes: "Find by 5-digit numeric pattern. Do NOT rely on label word 'Zip'."

  money:
    description: "US dollar as float rounded to 2 decimals"
    transform: strip_currency_symbols_commas_then_float
    strip_chars: ["$", ",", " ", " "]

  date:
    description: "ISO 8601 date string YYYY-MM-DD"
    transform: parse_date_to_iso8601
    input_formats:
      - "MM/DD/YYYY"
      - "MM-DD-YYYY"
      - "M/D/YYYY"
      - "MMMM D, YYYY"
      - "MMM D, YYYY"
      - "YYYY-MM-DD"
      - "MM/DD/YY"

  year:
    description: "4-digit year as integer"
    transform: extract_4digit_year
    value_range: {min: 1800, max: 2030}

  integer:
    description: "Whole number as int"
    transform: strip_non_digits_then_int

  numeric:
    description: "Decimal number as float"
    transform: strip_currency_then_float

  percent:
    description: "Percentage as float 0.0–100.0"
    transform: strip_percent_then_float
    value_range: {min: 0.0, max: 100.0}

  boolean:
    description: "Three-state: True / False / None"
    transform: checkbox_to_three_state
    true_values: ["Yes", "Y", "X", "x", "✓", "☑", "True", "1", "yes", "YES"]
    false_values: ["No", "N", "☐", "False", "0", "no", "NO"]
    unknown_sentinel: null
    notes: "None = VERIFY. Never FAIL from unknown. Never treat not-found same as False."

  uad_condition:
    description: "UAD condition code C1 through C6"
    transform: extract_uad_code
    allowed_values: ["C1", "C2", "C3", "C4", "C5", "C6"]
    descriptions:
      C1: "New — never previously occupied"
      C2: "Excellent — no deferred maintenance"
      C3: "Good — well-maintained, minor deferred maintenance"
      C4: "Average — adequately maintained, some deferred maintenance"
      C5: "Fair — poor maintenance, significant deferred maintenance"
      C6: "Poor — extreme deferred maintenance, uninhabitable"

  uad_quality:
    description: "UAD quality code Q1 through Q6"
    transform: extract_uad_code
    allowed_values: ["Q1", "Q2", "Q3", "Q4", "Q5", "Q6"]
    descriptions:
      Q1: "Unique — architecturally significant, one-of-a-kind"
      Q2: "Custom — individually designed"
      Q3: "Quality — above-standard construction and finishes"
      Q4: "Standard — meets standard building codes"
      Q5: "Fair — below-standard construction"
      Q6: "Low — minimal quality, lowest-grade construction"

  fema_zone:
    description: "FEMA flood zone designation"
    transform: uppercase_strip
    allowed_values: ["A", "AE", "AH", "AO", "AR", "A99", "V", "VE", "X", "B", "C", "D"]

  census_tract:
    description: "Normalized census tract"
    transform: strip_whitespace_normalize_decimal

  area:
    description: "Area as float"
    transform: strip_commas_then_float

  string_trim:
    description: "Whitespace-trimmed string"
    transform: strip_whitespace

  string_list:
    description: "List of strings, comma or newline separated"
    transform: split_on_comma_or_newline_strip_each

# =============================================================================
# CONFIDENCE THRESHOLDS
# Routing: auto_accept → no review needed
#          review      → optional human review
#          reject      → treat as not-found, flag for manual input
# All values stored here, never hardcoded. Override per-field or per-AMC.
# =============================================================================

confidence_thresholds:

  defaults:
    auto_accept: 0.90
    review: 0.65
    reject: 0.30

  per_field:
    property_address:   {auto_accept: 0.92, review: 0.70, reject: 0.35}
    borrower_name:      {auto_accept: 0.90, review: 0.65, reject: 0.30}
    contract_price:     {auto_accept: 0.95, review: 0.75, reject: 0.40}
    contract_date:      {auto_accept: 0.93, review: 0.70, reject: 0.35}
    appraised_value:    {auto_accept: 0.95, review: 0.75, reject: 0.40}
    effective_date:     {auto_accept: 0.93, review: 0.70, reject: 0.35}
    condition_rating:   {auto_accept: 0.88, review: 0.65, reject: 0.30}
    quality_rating:     {auto_accept: 0.88, review: 0.65, reject: 0.30}
    lender_name:        {auto_accept: 0.90, review: 0.65, reject: 0.30}
    market_conditions_commentary: {auto_accept: 0.80, review: 0.55, reject: 0.25}

  extraction_method_base_confidence:
    exact_label_match:   0.95
    synonym_match:       0.85
    positional_anchor:   0.82
    data_pattern_only:   0.78
    fuzzy_label_match:   0.72
    embedding_match:     0.68
    llm_inference:       0.55
    not_found:           0.00
