  # SECTION: subject  (URAR Subject section, items S-1 through S-12)
  # ===========================================================================

  property_address:
    canonical_name: property_address
    data_type: string
    required: required_cross_document
    synonyms:
      - "Property Address"
      - "Subject Property"
      - "Subject Property Address"
      - "Property Addr"
      - "Property Addr."
      - "Prop. Address"
      - "Subject Addr"
      - "Address"
      - "Property Location"
      - "Subject Address"
      - "Location of Property"
    source_authority: engagement_letter
    sections: [subject, engagement_letter]
    required_for_review: true
    notes: "Street + number only. City/State/Zip extracted separately. Find by data pattern (5-digit zip anchor), not label word."

  city:
    canonical_name: city
    data_type: string
    required: required_cross_document
    synonyms:
