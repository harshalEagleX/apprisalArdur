# =============================================================================
# Apprisal Platform — Canonical Field Schema
# Day 1 Artifact: The single authoritative reference for every extractable field
#
# RULES:
#   - Never hardcode field definitions in Python. This file is the source of truth.
#   - Edit here and call schema_loader.reload() — no service restart needed.
#   - Every field MUST have: canonical_name, data_type, required, synonyms,
#     source_authority, sections. Optional: allowed_values, value_range, notes.
#   - Canonical names never change. Add synonyms — never rename a canonical.
# =============================================================================

meta:
  schema_version: "1.0.0"
  created: "2026-05-15"
  purpose: >
    Authoritative field schema for all extractable fields across all appraisal
    document types. Every extraction tier, validation rule, and reviewer display
    references this file. It is the contract between all system components.

# -----------------------------------------------------------------------------
# DOCUMENT TYPES — what the system knows how to process
# -----------------------------------------------------------------------------
document_types:

  engagement_letter:
    description: "AMC engagement order / appraisal order form"
    authority_for:
      - borrower_name
      - co_borrower_name
      - property_address
      - city
      - state
      - zip_code
      - county
      - lender_name
      - lender_address
      - assignment_type
      - loan_type

  appraisal_report:
    description: "URAR UAD 1004 appraisal report (all pages)"
    sections:
      - subject
      - contract
      - neighborhood
      - site
      - improvements
      - sales_comparison
      - reconciliation

  sales_contract:
    description: "Purchase and Sale Agreement / Sales Contract"
    authority_for:
      - contract_price
      - contract_date
      - seller_name
      - concessions_amount
      - personal_property_items

  qc_checklist:
    description: "AMC QC checklist or review scorecard document"
    authority_for: []

# -----------------------------------------------------------------------------
# DATA TYPES glossary
#   string        — free text, whitespace-trimmed
#   date          — normalized to YYYY-MM-DD
#   currency      — US dollar amount as float (no symbols, no commas)
#   integer       — whole number as int
#   numeric       — decimal number as float
#   percent       — float 0.0–100.0
#   year          — 4-digit integer
#   boolean       — three-state: True / False / None (None means VERIFY, not FAIL)
#   state_code    — 2-letter uppercase US state abbreviation
#   zip5          — 5-digit string "12345"
#   uad_condition — enum C1..C6
#   uad_quality   — enum Q1..Q6
#   fema_zone     — enum A/AE/AH/AO/AR/A99/V/VE/X/B/C/D
#   enum          — fixed list of allowed string values (listed in allowed_values)
#   string_list   — list of strings, comma- or newline-separated
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# REQUIRED STATUS
#   required_cross_document — must be present AND match across documents
#   required                — must be present in its source document
#   optional                — extracted if present, no failure if absent
#   derived                 — computed from other fields, not directly extracted
# -----------------------------------------------------------------------------

fields:

