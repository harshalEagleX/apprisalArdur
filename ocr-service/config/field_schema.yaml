      - "St."
      - "ST"
      - "State Code"
    source_authority: engagement_letter
    sections: [subject, engagement_letter]
    required_for_review: true
    notes: "Find by 2-letter uppercase before the 5-digit zip — do not depend on label word."

  zip_code:
    canonical_name: zip_code
    data_type: zip5
    required: required_cross_document
    value_range: {pattern: "^\\d{5}$"}
    synonyms:
