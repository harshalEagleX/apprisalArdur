# QC reviewer message templates.
# Placeholders {a}/{b}/{value}/{field}/{comp} are filled at emit time.
# Keep language plain, clear, and action-oriented — no internal jargon.

# ---- Subject ----
S-1-address:  "The property address in the report doesn't match the order form. Please correct it."
S-1-city:     "The city name doesn't match the order form. Please correct it."
S-1-zip:      "The zip code doesn't match the order form (first 5 digits must agree). Please correct it."
S-1-county:   "The county doesn't match the order form. Please correct it."
S-2-coborrower: "Please add co-borrower '{value}' to the report — this name is on the order form."
S-2-refi-owner: "This is a refinance, but the property owner name and borrower name are different. Please verify or add a comment explaining the difference."
S-3-blank:    "The '{field}' field is blank. Please complete it."
S-4-taxyear:  "The tax year shown is outdated — it should be the current year or at most 2 years old. Please update."
S-4-taxdecimal: "Real estate taxes should be a whole dollar amount (no cents). Please remove the decimal."
S-5-neighborhood: "The neighborhood name is listed as N/A. Please enter a real neighborhood name — it can be a subdivision name, a municipality name, or the name residents commonly use for the area."
S-6-mapref:   "Map Reference must be a number — please provide it."
S-6-census:   "Census Tract must be in the format 1234.56 — please provide it."
S-7-occ-vacant: "The subject section says owner-occupied, but the photos suggest the property is vacant. Please correct the occupancy status or add a comment."
S-7-occ-occupied: "The subject section says vacant, but the photos suggest someone is living there (possibly a staged home). Please correct the occupancy status or add a comment."
S-8-assessment: "A special assessment of ${value} is shown. Please add a note explaining what this assessment is for."
S-7-occupant: "The occupancy status is not marked. Please select Owner, Tenant, or Vacant in the subject section."
S-11-rights:  "Property rights are not marked. Please select Fee Simple or Leasehold in the subject section."
S-9-pud:      "HOA dues of ${value}/year are shown, but the PUD box is not checked. If there is an HOA, the PUD box should be marked. Please revise."
S-10-lender:  "Please correct the lender's name to: {value}"
S-10-lender-addr: "Please correct the lender's address to: {value}"
S-12-datasource: "The checkbox about prior sale or listing activity in the past 12 months is missing a data source. Please provide the source used to answer this question."
S-1-state:    "The state doesn't match the order form. Please correct it."
S-4-legal:    "The legal description appears incomplete: '{value}'. Please provide the full legal description."
S-4-apn-format: "The parcel number '{value}' doesn't look right for {state}. Please verify the assessor's parcel number."
S-4-tax-implausible: "The real estate taxes of ${value} seem unusually high or low for this property. Please verify."
S-5-generic:  "'{value}' is too generic for a neighborhood name. Please use the actual subdivision name or the name residents commonly use."
S-7-tenant:   "Occupancy is marked Tenant. Please add the lease terms (start/end dates and monthly rent amount) to the report."
S-7-vacant:   "Occupancy is marked Vacant. Please add a comment on whether the utilities were on or off at the time of inspection."
S-12-listing: "The property was listed for sale in the past 12 months. Please add the listing details ({value}) to the subject section."
S-2-contract-buyer: "The purchase contract lists additional buyer(s) {value} who are not on the order form. Please confirm whether a co-borrower should be added."

# ---- Contract ----
C-1-refi-blank: "This is a refinance — the contract price, date, and concession fields should be empty (no purchase contract exists). The 'did not analyze the contract for sale' box should be checked. Please confirm the transaction type and revise the contract section."
C-2-price:    "The contract price in the appraisal (${a}) doesn't match the purchase contract (${b}). Please verify."
C-2-date:     "The contract date in the appraisal ({a}) doesn't match the purchase contract ({b}). Please verify."
C-3-datasource: "Please provide a data source for the question about whether the seller is the owner of public record (in the contract section)."
C-4-concession: "The seller concession in the purchase agreement (${b}) doesn't match the report (${a}). Please verify."
C-1-analyze:  "The contract analysis is missing. Please complete the contract analysis or explain why it was not done."
C-1-saletype: "The type of sale is not identified. Please note whether this is an Arm's-Length sale, REO, Short Sale, Court-Ordered Sale, or Non-Arm's-Length in the contract section."
C-1-variance: "The appraised value (${a}) is more than {pct}% away from the contract price (${b}). Please explain in detail why the value differs from the contract and what supports the conclusion."
C-3-comment:  "The seller is not the owner of public record. Please add a comment explaining the circumstances of this sale."
C-4-blank:    "The seller concession checkbox (financial assistance) is not answered. Please mark Yes or No."
C-4-contradict: "Financial assistance is marked No, but a concession of ${value} is shown. These contradict each other — please revise."
C-4-desc:     "Financial assistance is marked Yes. Please provide the total dollar amount and describe what items are being paid on the borrower's behalf."
C-5-personal: "The purchase contract includes personal property ({value}). Please note in the report whether these items have any contributory value."
C-1-txn-unknown: "The transaction type couldn't be confirmed. Please verify whether this is a purchase or refinance, and fill in the contract section accordingly."
C-EXEC-unsigned: "The appraisal notes the purchase contract is not fully signed by all parties. Per client instructions, this file must be returned and cannot be processed until a fully executed contract is received. Do not continue."

# ---- Neighborhood ----
N-1-checkbox: "The '{field}' checkbox in the neighborhood section is not marked. Please complete it."
N-3-range:    "The neighborhood price and age ranges are in reverse order (High to Low). Please flip them to Low–High."
N-4-landuse:  "The land-use percentages don't add up to 100%. Please verify each percentage and make sure the total is exactly 100%."
N-4-other:    "A percentage is shown for 'Other' land use. Please add a description of what that other use is."
N-5-boundary: "The {field} boundary is not described. Please add it to the Neighborhood Boundaries section."
N-5-delineation: "The Neighborhood Boundaries section is missing direction descriptions. Please describe the boundaries using North, South, East, and West."
N-5-abbrev: "The neighborhood boundaries use single-letter direction codes (N, S, E, W). Please spell them out: North, South, East, West."
N-5-maponly: "The boundary section just says 'See map.' The boundaries must be written out in the report — a map reference alone is not enough. Please describe them."
N-1-landuse-x: "Built-Up is marked as '{a}' but the land-use section shows {b}% residential — these seem inconsistent. Please verify."
N-2-mca: "The trend checkbox ({a}) on page 1 doesn't match the trend in the market conditions addendum ({b}). Please make them consistent or add a comment explaining the difference."
N-3-predominant: "The predominant {field} ({value}) falls outside the Low–High range given. Please correct either the range or the predominant value."
N-3-valuepred: "The appraised value (${a}) is more than {pct}% away from the typical neighborhood price (${b}). Please add a comment addressing whether the property is over- or under-improved for the area."
N-3-comprange: "Comparable price(s) ({value}) fall outside the neighborhood price range you stated. Please verify the range or add a comment explaining the difference."

# ---- Site ----
ST-5-nozoning: "Zoning is marked 'No Zoning'. Please add a comment on whether the property could be rebuilt if destroyed."
ST-5-nonconforming: "Zoning is marked 'Legal Non-Conforming'. Please explain why the property is non-conforming and whether it can be rebuilt if more than 50% is destroyed."
ST-5-illegal-hold: "Zoning is marked 'Illegal'. This file is on HOLD — please escalate to the client before continuing."
ST-6-hbu-hold: "Highest and Best Use is not marked as the current use. This file is on HOLD — please escalate before continuing."
ST-7-wellseptic: "The property has a private well and/or septic system. Please add a comment on whether this is typical for the area and whether it affects marketability or value."
ST-7-privatestreet: "The property is on a private street. Please comment on the condition of the street and who is responsible for its maintenance."
ST-8-flood:   "The property is in a flood zone. Please add a comment on whether this affects marketability."

# ---- Sales Comparison ----
SCA-7-concession: "Please fill in Sales or Financing Concessions for Comp {comp}, or add a comment if no adjustment is needed."
SCA-8-datesale: "For Comp {comp}, the sale date appears to be before the contract date. Please verify these dates are correct."
SCA-grid-zero: "Comp {comp} differs from the subject on {field} but no adjustment is shown. Please enter $0 if no adjustment is warranted, or add supporting commentary."
SCA-net15:    "Comps {value} have net adjustments over 15%. Please explain in the report why these comparables are still appropriate."
SCA-gross25:  "Comps {value} have gross adjustments over 25%, which suggests they may be quite different from the subject. Please explain why they were used, or consider adding stronger comparables."
SCA-PSH-subj: "The subject property was transferred {months} month(s) ago. Please explain in the report how this prior transfer relates to the current value conclusion."
SCA-PSH-largegain: "The subject sold {months} months ago at ${prior:,}. The current value conclusion is ${current:,} — a {gain}% increase. Please explain specifically what changed to support this increase (renovation, market shift, etc.). A general statement is not sufficient."
SCA-PSH-Q-quality: "The prior sale/listing analysis only lists dates and amounts. Please expand it to explain how the prior sale relates to the current value — including the list-to-sale price difference, how long it was on market, and what this tells us about current marketability."
SCA-FLIP-comp: "Comp {comp} resold within {months} month(s). Please confirm this was an arm's-length transaction and add a comment on the quick turnaround."
SCA-25-newconst: "The subject appears to be new construction. Please confirm at least one comparable is from a competing development, or explain why that wasn't possible."
SCA-26-gla: "The subject's living area ({subj} sf) falls outside the range of comparable living areas ({lo}–{hi} sf). Please confirm the comparables adequately support the subject's size, or add a comment."
SCA-zadj-same: "Comp {comp}'s {field} ({v}) matches the subject, but a ${a} adjustment was still applied. Please confirm this adjustment is warranted."
SCA-zadj-diff: "Comp {comp}'s {field} ({cv}) differs from the subject ({sv}), but no adjustment was made. Please apply an adjustment or add a comment explaining why none is needed."
SCA-23-listing: "Comp {comp} is an active listing with no adjustment applied. Listings are priced at asking price and usually need a downward adjustment to reflect what they'd actually sell for. Please review or add a comment."
SCA-18-bsmt: "Basement and below-grade rooms are missing for Comp {comp}. Please fill this in (finished sq ft and room count, or 'None' if there is none)."
SCA-15-age: "The subject's stated actual age ({age} years) doesn't match year built ({yb}), which would make it about {exp} years old. Please correct one of these figures."
SCA-zf-same: "Comp {comp}'s {field} matches the subject, but a ${a} adjustment was still applied. Please confirm this adjustment is warranted."
SCA-ac-inconsistent: "Comp {comp}'s {field} ({value}) is similar to other comps that received a ${a} adjustment, but no adjustment was applied here. Please apply the adjustment consistently, or explain the difference."
SCA-bracket:  "The final value conclusion is not within the range of the adjusted comparable prices. Please add comparables that bracket the value, or explain in the report why the value is supportable."
SCA-bracket-na: "Adjusted sale prices could not be confirmed from the grid. Please manually verify that the final value falls within the range of adjusted comparable prices."
SCA-BR2-below: "Only {have} of the comparable adjusted prices are at or above the final value of ${value:,}. The client requires at least {need}. Please add a comp with an adjusted price at or above the value, or provide specific commentary explaining why the value is supported without it."
SCA-2-count:  "This appraisal needs at least {required} closed comparable sales. Only {value} were found in the grid. Please confirm all comps were captured, or add additional comparable sales."
SCA-2-listings: "Only {have} active listing comparable(s) were found ({sales} closed sales). The client requires at least {need} active listing(s). Please add one or explain in the report why none is available."
SCA-2-listings-decl: "Only {have} active listing comparable(s) were found ({sales} closed sales). The market appears to be declining or oversupplied, which makes an active listing comparable required by the client. Please add a current listing or pending sale, or give a specific explanation why none is available."
SCA-4-prox:   "Please add the proximity to subject (distance and direction) for Comp {comp} in the sales grid."
SCA-5-ds:     "Please provide a data source (such as MLS name and number) for Comp {comp} in the sales grid."
SCA-5-dom:    "Comp {comp} was on the market for {dom} days, which is longer than typical ({mt} days) for this area. Please confirm this is addressed in the report or explain why the comp is still appropriate."
SCA-16-cond:  "Please provide a condition rating (C1 through C6) for Comp {comp} in the sales grid."
SCA-3-addr:   "Please add the property address for Comp {comp} in the sales grid."
SCA-6-verif:  "Please provide a verification source (such as county records or MLS data) for Comp {comp} in the sales grid."
SCA-9-loc:    "Please provide a location rating for Comp {comp} in the sales grid (format: rating followed by type, e.g. 'N;Res')."
SCA-9-zeroadj: "Comp {comp}'s location doesn't include the subject's {desc} factor, but no location adjustment was applied. Please confirm no adjustment is needed, or add a comment."
SCA-10-rights: "Please indicate the property rights (Fee Simple or Leasehold) for Comp {comp} in the sales grid."
SCA-10-lease: "The subject is Leasehold but Comp {comp} is Fee Simple. Please add a comment confirming leasehold comparables were not available."
SCA-11-site:  "Please add the site size (in sq ft or acres) for Comp {comp} in the sales grid."
SCA-12-view:  "Please provide a view rating for Comp {comp} in the sales grid (e.g. 'N;Res' or 'B;Park')."
SCA-12-zeroadj: "Comp {comp}'s view doesn't include the subject's {desc} factor, but no view adjustment was applied. Please confirm no adjustment is needed, or add a comment."
SCA-14-qual:  "Please provide a quality rating (Q1 through Q6) for Comp {comp} in the sales grid."
SCA-14-comment: "All comparables show the same quality as the subject, with no quality adjustments. Please confirm the report commentary supports this — no supporting narrative was found."
SCA-17-consist: "The subject {field} in the sales grid ({a}) doesn't match the improvements section ({b}). Please make these consistent."
SCA-17-gla: "The subject's living area (GLA) doesn't match across all sources ({srcs}) — the difference is {delta} sf. Please make the sales grid, improvements section, and building sketch all show the same GLA."
SCA-17-nosketch: "The living area couldn't be confirmed across all sources ({srcs}). Please verify the GLA in the sales grid matches the improvements section and the building sketch."
SCA-17-comp-gla: "The living area for Comp {comp} is missing or doesn't look right. Please verify the GLA in the sales grid."
SCA-DC-old:   "Comp {comp} sold {months} months ago — more than 12 months back. Please add a comment explaining why a more recent sale wasn't available."
SCA-PR-bracket: "Comp {comp}'s sale price (${a}) is quite far from the subject value (${b}). Please confirm this comparable is appropriate for the assignment."
SCA-7-conc:   "Comp {comp} shows seller concessions of ${a}, but no downward financing adjustment was made. Concessions typically require a downward adjustment — please review."
SCA-13-design: "Please add the design/style for Comp {comp} in the sales grid."
SCA-19-func:  "Please add functional utility for Comp {comp} in the sales grid."
SCA-20-heat:  "Please add the heating/cooling information for Comp {comp} in the sales grid."
SCA-21-garage: "Please add the garage or carport details for Comp {comp} in the sales grid."
SCA-22-porch: "Please add the porch, patio, or deck information for Comp {comp} in the sales grid."
SCA-16-consist: "Comp {comp}'s condition ({comp_c}) differs from the subject ({subj_c}) by {delta} rating levels. Please confirm a condition adjustment is applied in the grid."

# ---- Reconciliation / Cost / Income ----
R-1-mismatch: "The final value in the reconciliation section doesn't match the value shown in the sales comparison grid. These two numbers must agree — please make them the same."
R-1-range:    "The final value (${value}) is outside the range of the approach values (${a}–${b}). Please explain why the value was selected outside this range."
R-1-weight:   "The reconciliation must say which approach was relied on most (sales comparison, cost, or income) and briefly explain why. Please add that statement to the reconciliation section."
R-2-bias:     "The appraised value exactly matches the contract price. Please confirm the value was reached independently and is not simply meeting the contract."
R-2-asisbox:  "Neither the 'As Is' nor the 'Subject To' box is checked in the reconciliation. Please mark the appropriate box."
R-ASSIGN-COND: "The assignment condition box ({condition}) doesn't match the language used in the report narrative. Please make sure the box and the written description agree."
CA-1-sitevalue: "The cost approach is missing an opinion of site value. Please provide one."
CA-3-arith:   "The cost approach total (${value}) doesn't match site value (${a}) + depreciated improvement cost (${b}). Please recheck the cost approach math."
CA-3-depr:    "The depreciation amount looks out of line with the property's effective age and remaining useful life. Please confirm the depreciation is supportable."
IA-1-rent:    "The monthly rent in the income approach (${a}) doesn't match the rent schedule (${b}). Please make these consistent."
MF-1-income:  "This is a multi-unit property. The income approach and a rent schedule must be included in the report."
USDA-1-fields: "The cost approach is required for USDA loans. Please complete the following fields: {value}."

# ---- Signature ----
SIG-1-missing: "Appraiser signatures are missing. Please sign in all required spaces throughout the report."
SIG-date:     "The signature date is before the effective date. The appraiser must sign on or after the effective date. Please correct this."
SIG-2-field:  "The '{field}' on the signature page doesn't match the order form. Please correct it."
SIG-3-state:  "The appraiser's license is for {a}, but the property is in {b}. Please confirm the appraiser is licensed in the correct state."
SIG-amc-missing: "The AMC name is missing from the signature section. Please add: {value}."
SIG-amc-wrong: "The AMC name in the signature section is incorrect. Please update it to: {value}."

# ---- Improvements ----
I-1-gendesc:  "Please complete the General Description (Design/Style and Year Built) in the improvements section."
I-1-fields:   "Please complete the General Description in the improvements section ({value} missing)."
I-1-age:      "The effective age ({a} years) is more than the actual age ({b} years, based on year built). A home can't be functionally older than it actually is. Please correct the effective age or year built."
I-2-foundation: "Please complete the Foundation description in the improvements section."
I-34-materials: "The following materials/condition fields are missing in the improvements section: {value}. Please complete them — if something doesn't apply, enter 'None' rather than leaving it blank."
I-9-grid:     "The condition rating in the improvements section ({a}) doesn't match the subject column in the sales grid ({b}). Please make these consistent."
I-9-effage:   "A {value} condition rating is typically associated with a lower effective age, but the effective and actual ages are the same here. Please verify the effective age is correct."
I-9-noupdate: "The effective age ({eff} years) is {gap} years less than the actual age ({actual} years), suggesting updates were made — but the report narrative describes no updates and mentions original condition. Please either describe what was updated to justify the lower effective age, or revise the effective age."
I-SMCO-missing: "No mention of smoke or CO detectors was found in the report. The client requires a note confirming detectors meet local code — please add one to the report narrative."
I-10-adverse: "A physical deficiency or adverse condition is indicated. Please confirm this is addressed in the report with specific commentary on how it affects the property."
I-12-addition: "The report mentions an addition or conversion ({value}). Please confirm the report addresses whether it was permitted, whether it conforms to the structure, and whether it affects marketability."
I-7-roomcount: "Please complete the room count (Total Rooms, Bedrooms, Baths, GLA) in the improvements section."
I-9-condition: "The condition rating must be C1 through C6, must match the photos and narrative, and must be consistent with the effective age. Please review."
I-Q-quality:  "The quality rating must be Q1 through Q6. Please verify and correct."
I-11-conform: "The property is marked as not conforming to the neighborhood. Please add detailed commentary explaining why, whether it could be rebuilt if destroyed, and whether it is over- or under-improved."

# ---- Site (additional) ----
ST-2-area:    "Site area must include a unit: 'sf' for sites under 1 acre, 'ac' for 1 acre or more. Please correct."
ST-7-utilities: "Gas and Electricity checkboxes must be marked in the site section. The description field cannot be left as None or N/A."
ST-1-dims:    "Site dimensions must show actual measurements. For an irregular site, please include a plat map with the subject clearly marked."
ST-3-shape:   "Please provide the site shape. For an irregular shape, include a plat map with the subject clearly marked."
ST-4-view:    "The view must be formatted as a rating followed by the view factor (e.g. 'N;Res' for a neutral residential view). Please correct."
ST-4-grid:    "The view rating in the site section ({a}) doesn't match the subject column in the sales grid ({b}). Please make these consistent."
ST-8-femadata: "The flood zone information (zone, map number, and map date) must be completed in the site section — this is required even if the property is not in a flood zone."
ST-10-adverse: "An adverse site condition or external factor is indicated. Please add commentary describing what it is and how it affects value and marketability."

# ---- Reconciliation / Cost (additional) ----
CA-2-life:    "The remaining economic life must be at least 30 years for FHA/VA loans. If it is less, please clearly explain why."

# ---- FHA / USDA (conditional on loan type) ----
FHA-2-case:   "FHA case number is missing or incorrectly formatted. It must appear as 123-1234567 (3 digits, dash, 7 digits) on every page of the report."
FHA-2-match:  "The FHA case number in the report ({a}) doesn't match the order form ({b}). Please verify which is correct."
FHA-3-intended: "Both the Intended Use and Intended User statements are required for FHA. Please include both: the client/lender and HUD/FHA as intended users."
FHA-4-mpr:    "Please add a statement confirming whether the property meets FHA minimum property requirements."
FHA-5-comps:  "FHA requires the first three comparable sales to be within 12 months. Comp {comp} appears to be outside this window — please address."
ADD-2-selection: "The comparable selection commentary describes what was done but doesn't explain why these specific comps were chosen. Please add a brief explanation of how they are similar to the subject and represent the same buyer pool."
ADD-5-fields: "The market conditions addendum has incomplete fields: {value}. Each required cell must have a number, 0, or N/A — it cannot be left blank."
ADD-8-condo:  "The subject is a condominium. The condo/co-op project section of the market conditions addendum must be completed. The following fields are missing: {value}."
ADD-9-type:   "The addendum must identify the report type as 'Appraisal Report' or 'Restricted Appraisal Report'. Please confirm this statement is present."
ADD-9-exposure: "Exposure time must be a specific period (e.g. '3-6 months'), not a vague statement. Please revise."
ADD-9-services: "Prior services are disclosed but not described. Please add a description of the services performed in the last 3 years."
SIG-1-gap:    "The signature date is {value} days after the effective date. Please verify the reporting timeline is correct."
SIG-sup:      "The supervisory appraiser section is filled in, but it's missing the inspection checkbox ('Did' or 'Did Not' inspect) or the supervisory signature. Please complete."
FHA-10-life:  "The remaining economic life must be stated and at least 30 years for FHA. If it is less, please explain."
USDA-1-cost:  "The cost approach is required for USDA loans. Please complete it."
ADD-4-mc:     "The market conditions addendum is required for FHA/USDA loans but appears to be missing or incomplete. Please include and complete it."

# ---- Commentary / NLP (advisory) ----
N-6-blank:    "The Neighborhood Description is blank. Please write a description specific to this neighborhood."
N-6-canned:   "The Neighborhood Description appears to contain generic boilerplate ({hits}). Please rewrite it to describe this specific neighborhood."
N-6-generic:  "The Neighborhood Description reads like a generic template. Please add specific details — like nearby streets, local landmarks, proximity to schools or shops, or how prices have been moving in this area."
N-7-see1004mc: "The market conditions section just says 'See 1004MC' instead of containing the actual analysis. Please put the market analysis directly in this section — don't just point to another page."
N-7-blank:    "The market conditions section is blank. Please complete it with an actual market analysis for this area."
N-7-generic:  "The market conditions commentary only restates the checkbox answers in paragraph form. Please add real numbers — like average days on market, months of supply, or price trend data — to back up the conclusions."
ADD-1-canned: "The {field} commentary appears to be boilerplate language ({hits}). Please rewrite it to describe this specific property and market — generic language doesn't meet QC standards."
RECON-terms:  "The reconciliation uses terms like 'equal weight' or 'weighted average' ({hits}), which should be avoided. Please rewrite this to explain specifically how the comparables were used to arrive at the value."

# ---- Docs ----
DOC-1-expired: "The appraiser's license in the report is expired. Please provide an updated copy."

# ---- Maps ----
M-1-location: "The location map must clearly show the subject property and all comparable sales. Please provide or update it."
M-3-plat:     "A plat map is required because the exact site dimensions couldn't be shown on the form. Please include one."
M-4-flood:    "The property is in a flood zone. Please include a flood map."

# ---- Coverage-audit additions ----
I-5-utilities:     "The following heating/cooling fields are not described in the improvements section: {value}. Please complete."
I-6-appliances:    "No kitchen appliances are listed in the improvements section. Please note which appliances are present."
I-8-features:      "Please confirm any additional features (fireplace, porch/patio/deck, pool, etc.) are described in the improvements section, or state 'None'."
ST-9-typical:      "Please confirm the utilities and off-site improvements are typical for the market area. If not, describe and comment on marketability."
SIG-4-email:       "The appraiser's email address is missing or unreadable. Please provide it."
FHA-1-mpr:         "FHA loan: please confirm the property meets FHA minimum property requirements, or list any deficiencies."
FHA-4-statement:   "FHA loan: the required FHA certification statement couldn't be found. Please confirm it is in the report."
FHA-6-repairs:     "FHA loan: repairs or conditions are noted. The appraisal must be reported as 'subject to' completion of these items — please describe them."
FHA-7-spaceheater: "FHA loan: the primary heat source appears to be a space heater. FHA does not allow space heaters as the only heating system — please address this."
FHA-12-wellseptic: "FHA loan: the property has a private well and/or septic system. Please confirm distances and compliance with FHA requirements."
FHA-13-appliances: "FHA loan: please confirm all kitchen appliances are present and in working condition."

# ---- Arithmetic / Timeline / Consistency ----
I-1-yrbuilt:         "The report says the home is {stated} years old, but built in {yb} — that puts the actual age at about {calc} years. Please correct either the effective age or the year built."
TL-ENG-order:        "The order date ({a}) is after the report was signed ({b}). The appraiser must receive the order before completing the report. Please verify these dates."
TL-CONTRACT-late:    "The contract is dated {a}, which is after the appraisal effective date of {b}. The appraiser must have the contract in hand before the effective date. Please verify these dates."
C-ANALYZE-nocontract: "The report says the contract was reviewed, but no purchase contract was included in the file. Please provide the contract or update the contract section."
LISTING-CMNT-var:    "The most recent listing price ({listing}) differs from the final value (${value}) by {pct}%. Please add a comment in the report explaining this difference."

# ---- Reconciliation (new additions) ----
R-INCOME-RENTAL: "The property is listed as tenant-occupied (income-producing). Please either develop the income approach or add a note explaining why it wasn't used."
R-EXPOSURE: "No specific exposure time period was found. Please add a statement like 'estimated exposure time of 3-6 months' in the reconciliation or addendum."
R-MKTTIME: "The marketing time stated in the report appears inconsistent with the market data for this area. Please make sure the estimated selling time matches what the comparable sales and neighborhood data show."

# ---- Order-level cross-document rules (ORD-*) ----
ORD-FORM-MATCH: "The order form requires form type {ordered}, but the report appears to be on form {actual}. Please verify the correct form was used."
ORD-INSP-SCOPE: "The client ordered a {ordered} inspection, but the scope of work described in the report doesn't appear to match. Please confirm the correct inspection type was performed."
ORD-COBORROWER: "The order form lists '{co_borrower}' as a co-borrower, but that name doesn't appear in the appraisal's borrower field. Please add the co-borrower name."
ORD-ASSIGN-MATCH: "The order form says this is a '{ordered}' assignment, but the report says '{actual}'. The order form is the authority here — please update the report to match."

# ---- ST-INTENDED / ST-SCOPE ----
ST-INTENDED: "The report must state what the appraisal is for (mortgage lending) and who it is for (the lender/client). Please confirm both of these statements are present."
ST-SCOPE: "The scope of work description could not be found. Please verify the report describes what type of inspection was performed and what the appraiser did and did not do."
