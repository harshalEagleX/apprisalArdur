# Client-facing rejection templates — VERBATIM from "Appraisal QC Checklist
# -Detailed.xlsx" (Sheet1). These are the lender-approved standard wording; do
# not paraphrase. Placeholders {a}/{b}/{value}/{field}/{comp} are filled at
# emit time. Reviewers may add context but the base text is fixed (Q38).

# ---- Subject ----
S-1-address:  "Property address does not match with order form."
S-1-city:     "Property City name does not match with order form."
S-1-zip:      "Property Zip code does not match with order form. (First 5 digits must match)"
S-1-county:   "Property county does not match with order form."
S-2-coborrower: "Please include Co-borrower name {value} as per order form."
S-2-refi-owner: "Assignment type of the report is noted as 'Refinance'; however, the owner name and the borrower name are different, please revise or comment."
S-3-blank:    "{field} field should not be blank."
S-4-taxyear:  "Tax Year must be the latest or within the last 2 years."
S-4-taxdecimal: "R.E. Taxes should not contain decimals."
S-5-neighborhood: "The neighborhood name in subject section is mentioned as N/A. Per the UAD requirements, the appraiser should enter a neighborhood name. It may be a name recognized by the municipality in which the property is sited, such as a subdivision name. If there is no neighborhood name recognized by the municipality, enter the common name by which residents refer to the location. Please revise."
S-6-mapref:   "Map Reference should be in numeric and must be provided."
S-6-census:   "Census Tract should be in the format XXXX.XX and must be provided."
S-7-occ-vacant: "The subject section indicates that the property is owner occupied however the photos appear to show the property is currently vacant. Please revise or comment."
S-7-occ-occupied: "In subject section, occupancy is marked as vacant however as per photos subject property appears to be occupied, please revise or comment if it is a staged home."
S-8-assessment: "In the subject section, please specify what the special assessment of ${value} is for."
S-7-occupant: "In the subject section, please mark the Occupancy status (Owner, Tenant, or Vacant)."
S-11-rights:  "In the subject section, please mark the Property Rights Appraised (Fee Simple or Leasehold)."
S-9-pud:      "HOA dues are noted as \"${value}\" per year in the subject section however PUD box is not marked, please revise."
S-10-lender:  "Please correct the lender's name so it reflects as: {value}"
S-10-lender-addr: "Please correct the lender's address so it reflects as: {value}"
S-11-rights:  "Only one Property Rights Appraised checkbox may be marked."
S-12-datasource: "Please provide Data sources in subject section for the question “Is the subject property currently offered for sale or has it been offered for sale in the twelve months prior to the effective date of this appraisal?” as per UAD requirement."

# ---- Contract ----
C-1-refi-blank: "The assignment is meant for a refinance transaction; per the UAD requirements, the contract section should be left blank."
C-2-price:    "In the contract section Contract Price noted as ${a}; however, the purchase contract shows ${b}. Please verify."
C-2-date:     "In the contract section Contract Date noted as {a}; however, the purchase contract shows {b}. Please verify."
C-3-datasource: "Please provide data source for \"Is the property seller the owner of public record?\" under contract section."
C-4-concession: "Purchase agreement shows the concession as ${b}; however, the report shows concession as ${a}, please verify."

# ---- Neighborhood ----
N-1-checkbox: "In the neighborhood section checkbox is missing for {field}, please revise."
N-3-range:    "One unit housing price and age range should be Low to High."
N-4-landuse:  "The sum of present land use in the neighborhood section should always be 100%, please verify and revise as needed."
N-4-other:    "In the Present land use % if 'Other' is given a value then a description is needed."
N-5-boundary: "{field} boundary is missing under Neighborhood Boundaries, please revise."
N-5-delineation: "Neighborhood Boundaries does not contain boundary delineations. The Neighborhood Boundaries must be clearly delineated using 'North', 'South', 'East' and 'West'."

# ---- Site ----
ST-5-nozoning: "Zoning Compliance is marked 'No Zoning', please comment if the subject can be rebuilt if destroyed."
ST-5-nonconforming: "Zoning Compliance is marked 'Legal Non-Conforming'. Please explain why and if subject can be rebuilt if destroyed over 50%."
ST-5-illegal-hold: "Zoning Compliance is marked 'Illegal'. HOLD for escalation."
ST-6-hbu-hold: "Highest and Best Use is not marked 'Yes'. HOLD for escalation."
ST-7-wellseptic: "Private well and septic system: please comment if it is typical and if having this feature has impact on marketability and value."
ST-7-privatestreet: "Subject has “Private Street”; please comment on condition of the subject’s “Private Street” and who is responsible for the maintenance."
ST-8-flood:   "The appraisal indicates the subject property is in a FEMA designated flood zone. Please comment if it will impact the marketability of the Subject."

# ---- Sales Comparison ----
SCA-7-concession: "Please provide \"Sales or Financing Concessions\" for comp {comp}, or comment why adjustment is not warranted."
SCA-8-datesale: "Please verify whether the \"Date of Sale/Time\" for comp {comp} is correct as the sale date (S) is prior to the contract date (C)."
SCA-grid-zero: "Difference from subject to comp {comp} for {field} is not adjusted; the grid adjustment field must contain a 0 or commentary."
SCA-net15:    "Please address Comps {value} exceeding 15% net adjustments."
SCA-gross25:  "Please address Comps {value} exceeding 25% gross adjustments; these comparables may be too dissimilar — provide commentary or stronger comps."
SCA-PSH-subj: "The subject transferred {months} month(s) before the effective date; please analyze and reconcile this prior sale/transfer with the opinion of value."
SCA-FLIP-comp: "Comp {comp} resold within {months} month(s) of its sale date; please confirm the transaction was arm's-length and comment on the rapid resale."
SCA-25-newconst: "The subject appears to be new construction; please confirm at least one comparable is from a competing development (or comment on the dated-sale exception)."
SCA-26-gla: "The subject GLA ({subj} sf) is not bracketed by the comparable GLAs ({lo}-{hi} sf); please confirm the comparables support the subject's size."
SCA-27-missing: "Comparable photographs were not detected; please confirm a comparable-photo addendum is present for each comparable sale."
SCA-27-defer: "Comparable photographs are present ({pages} page(s)); please confirm they are appraiser drive-by photos (not MLS listing photos) for the loan type."
SCA-27-nobuilding: "The comparable photographs could not be confirmed to depict the subject-type buildings; please verify the correct comparable photos are included."
SCA-27-mls: "MLS/listing watermark text was detected on the comparable photographs; FHA requires the appraiser's own drive-by photos — please confirm and replace if needed."
SCA-16V-distress: "The comparable photographs show possible property distress that may conflict with the reported condition ratings; please confirm the condition ratings are supported."
SCA-16V-cond: "The comparable photographs appear to show a worse condition ({vis}) than the reported grid ratings ({rated}); please confirm the condition ratings are supported by the imagery."
SCA-zadj-same: "Comp {comp} {field} ({v}) matches the subject but a {field} adjustment (${a}) was applied; please confirm the adjustment is warranted."
SCA-zadj-diff: "Comp {comp} {field} ({cv}) differs from the subject ({sv}) but no {field} adjustment is shown; please apply an adjustment or comment."
SCA-23-listing: "Comp {comp} is an active listing but shows no net adjustment; listings are priced at list and typically warrant a downward (list-to-sale) adjustment — please review or comment."
SCA-18-bsmt: "Please provide the Basement & Finished Rooms Below Grade for comp {comp} in the sales grid (finished sf + components, or None)."
SCA-15-age: "The subject Actual Age ({age}) does not match the year built ({yb}, ~{exp} years from the effective date); please reconcile the age and year built."
SCA-zf-same: "Comp {comp} {field} matches the subject but a {field} adjustment (${a}) was applied; please confirm the adjustment is warranted."
SCA-ac-inconsistent: "Comp {comp} {field} ({value}) matches other comparables that received a ${a} {field} adjustment, but no adjustment was applied here; confirm adjustments are applied consistently or explain the difference."
SCA-bracket:  "Market Value is not bracketed by the adjusted sale prices of the comps. Please revise accordingly."
SCA-bracket-na: "Adjusted sale prices could not be confirmed from the sales comparison grid, so bracketing could not be tested automatically. Please verify the opinion of value falls within the range of the adjusted comparable sale prices shown in the grid."
SCA-2-count:  "A minimum of {required} comparable sales is required for this value. Only {value} closed comparable sale(s) were identified in the grid; please verify the remaining comparables were extracted."
SCA-2-listings: "Only {have} active/listing comparable(s) were identified ({sales} closed sales found); a minimum of {need} active listing(s) is required. Add the required listing comparables or document why none are available."
SCA-4-prox:   "Please provide Proximity to Subject (distance in miles and direction) for comp {comp} under the sales grid section."
SCA-5-ds:     "Please have a data source (MLS name, MLS #, DOM) for comp {comp} under the sales grid section."
SCA-5-dom:    "Comp {comp} days-on-market ({dom}) exceeds the neighborhood marketing time ({mt}); confirm the longer marketing period is addressed or the comparable remains appropriate."
SCA-16-cond:  "Please provide a Condition rating (UAD C1-C6) for comp {comp} in the sales grid."
SCA-3-addr:   "Please provide the property address for comparable sale {comp} under the sales grid section."
SCA-6-verif:  "Please provide a specific verification source (e.g. county assessor / MLS sale data) for comp {comp} in the sales grid."
SCA-9-loc:    "Please provide a UAD-compliant Location rating (Rating;type) for comp {comp} in the sales grid."
SCA-9-zeroadj: "Comp {comp} location does not include the subject's {desc} factor, yet no location adjustment was applied; confirm none is warranted or add supporting commentary."
SCA-10-rights: "Please provide the Leasehold/Fee Simple property rights for comp {comp} in the sales grid."
SCA-10-lease: "The subject is Leasehold but comp {comp} is Fee Simple; please confirm leasehold comparables were unavailable and comment."
SCA-11-site:  "Please provide the Site size with a unit (sf or ac) for comp {comp} in the sales grid."
SCA-12-view:  "Please provide a UAD-compliant View rating (Rating;factor) for comp {comp} in the sales grid."
SCA-12-zeroadj: "Comp {comp} view does not include the subject's {desc} factor, yet no view adjustment was applied; confirm none is warranted or add supporting commentary."
SCA-14-qual:  "Please provide a UAD Quality rating (Q1-Q6) for comp {comp} in the sales grid."
SCA-14-comment: "The comparables share the subject's construction quality with no quality adjustment applied; confirm the report commentary supports the equivalent quality (no quality commentary was detected)."
SCA-17-consist: "The subject {field} in the sales grid ({a}) does not match the improvements/site section ({b}); please reconcile."
SCA-17-gla: "Subject above-grade GLA disagrees across sources ({srcs}); the spread is {delta} sf. Reconcile the SCA grid, improvements section, and building sketch so the GLA matches."
SCA-17-nosketch: "Could not confirm the subject GLA against all three sources ({srcs}); verify the SCA grid GLA matches the improvements section and the building sketch's Total Living Area."
SCA-17-comp-gla: "Comp {comp} gross living area is missing or implausible; verify the GLA in the sales grid."
SCA-DC-old:   "Comp {comp} sold {months} months before the effective date (>12); please comment on why a more recent sale was unavailable."
SCA-PR-bracket: "Comp {comp} sale price (${a}) is outside a reasonable bracket of the subject value (${b}); please confirm comparable selection."
SCA-7-conc:   "Comp {comp} reports seller concessions (${a}) but the financing adjustment is not negative; concessions should adjust the sale price downward — please review."
SCA-13-design: "Please provide the Design (Style) for comp {comp} in the sales grid."
SCA-19-func:  "Please provide the Functional Utility for comp {comp} in the sales grid."
SCA-20-heat:  "Please provide the Heating/Cooling for comp {comp} in the sales grid."
SCA-21-garage: "Please provide the Garage/Carport for comp {comp} in the sales grid."
SCA-22-porch: "Please provide the Porch/Patio/Deck for comp {comp} in the sales grid."
SCA-16-consist: "Comp {comp} condition rating ({comp_c}) differs from the subject ({subj_c}) by {delta} ratings; please confirm a supporting condition adjustment is present."

# ---- Reconciliation / Cost / Income ----
R-1-mismatch: "In reconciliation section, Indicated Market Value does not match with indicated value by Sales Comparison Approach. Please revise."
R-2-asisbox:  "At least one box ('As Is' or 'Subject To') must be checked in the reconciliation section."
CA-1-sitevalue: "Please provide an Opinion of site value in the report."

# ---- Signature ----
SIG-1-missing: "The Appraiser Signatures are missing throughout the report, please sign in all the designated spaces."
SIG-date:     "Please correct the \"Date of signature and report\" on the signature page. The signature date should be greater than or equal to the effective date."
SIG-2-field:  "{field} on the signature page should match the engagement letter."
SIG-3-state:  "The appraiser's license/certification state ({a}) does not match the subject property state ({b}). Please confirm the appraiser is credentialed in the state where the property is located."
SIG-amc-missing: "In the signature card, please include the AMC name: {value}."
SIG-amc-wrong: "In the signature card, please update the AMC name: {value}."

# ---- Improvements ----
I-1-gendesc:  "Please complete the General Description (Design/Style and Year Built) in the improvements section."
I-7-roomcount: "Please complete the Above Grade room count (Total Rooms, Bedrooms, Baths, GLA) in the improvements section."
I-9-condition: "Condition of the Property must be UAD compliant (C1-C6), match the photos/commentary, and be supported by the effective age."
I-Q-quality:  "Quality of Construction must be UAD compliant (Q1-Q6)."
I-11-conform: "The property does not conform to the neighborhood; please provide extensive commentary (why it does not conform, can it be rebuilt if destroyed over 50%, is it overbuilt)."

# ---- Site (additional) ----
ST-2-area:    "Site Area must include a unit designation: 'sf' for sites under 1 acre, 'ac' for 1 acre or more."
ST-7-utilities: "Utilities (Gas and Electricity) checkboxes should be marked in the site section; the description field cannot state None or N/A."

# ---- Reconciliation / Cost (additional) ----
CA-2-life:    "Estimated Remaining Economic Life must be at least 30 years for FHA/VA, or explain why the subject does not meet the minimum."

# ---- FHA / USDA (conditional on loan type) ----
FHA-2-case:   "FHA Case # is required in the format XXX-XXXXXXX (10 digits, dash between) on all pages of the report."
FHA-2-match:  "FHA Case Number in the report is {a}; however the order form shows {b}. Please verify."
FHA-3-intended: "FHA requires BOTH the Intended Use and Intended User statements (Lender/Client and HUD/FHA). Please include them."
FHA-4-mpr:    "Please include a statement noting whether the subject meets FHA Minimum Property Requirements per HUD Handbook 4000.1."
FHA-5-comps:  "FHA requires comparable sales 1, 2 and 3 to be within 12 months of the effective date. Please address comp {comp}."
FHA-10-life:  "Estimated Remaining Economic Life must be given and at least 30 years for FHA; please clearly explain if less."
USDA-1-cost:  "The Cost Approach is required on all USDA loans; please complete the cost approach."
ADD-4-mc:     "The 1004MC Market Conditions Addendum is required for FHA/USDA loans; please ensure it is included and completed."

# ---- Commentary / NLP (advisory) ----
N-6-blank:    "The Neighborhood Description must be completed with a description specific to the area."
N-6-canned:   "The Neighborhood Description appears to contain canned/generic commentary ({hits}); please make it specific to the subject area."
N-7-see1004mc: "Market Conditions commentary states to 'See 1004MC' or defers to the addendum; per UAD this section must contain the actual market analysis. Please revise."
N-7-blank:    "Market Conditions must be completed with the actual market analysis."
ADD-1-canned: "{field} appears to contain canned/generic commentary ({hits}); commentary must be specific to this report."
RECON-terms:  "Reconciliation commentary uses a prohibited term ({hits}). Terms like 'equal weight/consideration' and 'weighted average' should not be used; discuss how the sales were weighted to derive the value."

# ---- Photographs ----
PH-1-missing: "Required subject photos appear to be missing ({which}). At a minimum, subject front, rear and street scene photos are required."
PH-2-interior: "Interior photos appear incomplete (missing {which}). Photos of the kitchen, living room, all bedrooms and all baths are required for interior inspection reports."
FHA-9-sides:  "FHA requires photos of all four sides of the subject (front, rear, left and right); {which} appears to be missing."

# ---- Docs ----
DOC-1-expired: "Please provide an updated copy of your License, as the copy provided in the report has expired."

# ---- Maps ----
M-1-location: "Location map must show the subject and all comparables; please provide/revise."
M-3-plat:     "Plat Map is required as site dimensions could not be provided on page 1."
M-4-flood:    "Flood Map is required as the subject is located in a Flood Zone."
