# ══════════════════════════════════════════════════════════════════════════════
# QC REJECTION CATALOG  —  machine-readable QC checklist (source of truth)
# ══════════════════════════════════════════════════════════════════════════════
# Hand-authored from readme/Appraisal QC Checklist -Detailed.xlsx (136 items).
# Turns the reviewer's Excel checklist into a structured spec that drives:
#   1. the exact reviewer REJECTION WORDING (reject_as, verbatim from the sheet),
#   2. WHAT to cross-check and HOW (check_type + cross_check + sources),
#   3. a COVERAGE MAP onto the existing rule engine (rule_id, or ~ = GAP).
#
# This file is a SPEC/REFERENCE. It is NOT executed yet — it is the plan of record
# for closing gaps and for pointing LLM cross-checking at the items that need it.
#
# ── field semantics ───────────────────────────────────────────────────────────
#   id           checklist id from the Excel (letter = pointer, number = field).
#   item         the checklist line.
#   rule_id      existing engine rule that implements it (see app/qc/rules/*),
#                or ~ when there is NO rule yet (a GAP to build).
#   check_type   presence      — a single field/checkbox must be filled/marked
#                format        — value must match a format/unit/enum
#                same_section  — two fields in the same section must agree
#                cross_section — fields in different sections must agree
#                cross_document— report vs engagement letter / purchase contract
#                cross_modal   — text vs sketch / photos / map (needs image reading)
#                narrative     — prose quality/meaning (specific, not canned, etc.)
#   llm_role     none      — deterministic only (regex / value compare)
#                read_fact — LLM READS a grounded fact off the page (e.g. GLA on the
#                            sketch, a described update) that a deterministic rule
#                            then compares. LLM never emits the verdict (P-14a/§17).
#                classify  — LLM classifies prose into a grounded fact (canned vs
#                            specific, substantive vs pointer) for a rule to judge.
#   cross_check  one-line statement of the comparison to perform.
#   sources      docs/sections/fields the check reads.
#   reject_as    the reviewer wording (verbatim from the sheet where present).
#
# ── LLM DISCIPLINE (this is the whole point of the "use LLM heavily" ask) ─────
# The LLM is used ONLY on cross_modal + narrative items (llm_role != none) — the
# checks regex genuinely cannot do (reading sketch/photos, judging prose). On every
# such item the LLM proposes a GROUNDED fact (verbatim quote required) and a
# deterministic rule renders PASS/VERIFY/FAIL. The ~130 presence/format/value checks
# stay deterministic. This is the Stage-2 comprehension pattern already validated in
# app/qc/llm_comprehension.py, generalised across the checklist.
# ══════════════════════════════════════════════════════════════════════════════

meta:
  source: "readme/Appraisal QC Checklist -Detailed.xlsx"
  authored: "2026-07-10"
  total_items: 136
  status: "spec — not executed; coverage map + gap plan"
  coverage_note: >
    Most items already have a rule (see rule_id). Real GAPs cluster in cross_modal
    image checks (photos 124-127, sketch presence 128-129, maps 130-133) and a few
    narrative/condo items — exactly where deterministic regex cannot reach and the
    LLM (llm_role: read_fact/classify) is the right tool.

items:

  # ─────────────────────────── ORDER-LEVEL POINTERS ──────────────────────────
  - id: "A"
    item: "Form Type (Product)"
    rule_id: ORD-FORM-MATCH
    check_type: cross_document
    llm_role: none
    requirement: "Report form must be the same product that was ordered."
    cross_check: "appraisal.form_type == engagement.form_type"
    sources: [{doc: appraisal, fields: [form_type]}, {doc: engagement, fields: [form_type]}]
    reject_as: ["The report form type does not match the form type ordered. Please revise."]

  - id: "B"
    item: "Transaction type"
    rule_id: ORD-ASSIGN-MATCH
    check_type: cross_document
    llm_role: none
    requirement: "Loan/assignment type on the order form must match the report."
    cross_check: "appraisal.assignment_type == engagement.loan_type"
    sources: [{doc: appraisal, fields: [assignment_type]}, {doc: engagement, fields: [loan_type]}]
    reject_as: ["The assignment type in the report does not match the order form. Please revise."]

  # ───────────────────────────── SUBJECT SECTION ─────────────────────────────
  - id: "C"
    item: "Property Address, City, State, Zip Code and County"
    rule_id: S-1
    check_type: cross_document
    llm_role: none
    requirement: "Must match the engagement letter exactly; verify via USPS."
    cross_check: "subject address/city/state/zip(first5)/county == engagement (normalized)"
    sources:
      - {doc: appraisal,  fields: [property_address, property_city, property_state, property_zip, property_county]}
      - {doc: engagement, fields: [property_address, property_city, property_state, property_zip, property_county]}
    reject_as:
      - "Property address does not match with order form."
      - "Property City name does not match with order form."
      - "Property Zip code does not match with order form. (first 5 digits only)"
      - "Property county does not match with order form."

  - id: "D"
    item: "Borrower"
    rule_id: S-2
    also: [ORD-COBORROWER]
    check_type: cross_document
    llm_role: none
    requirement: "Must match engagement letter exactly; watch missed co-borrower, middle/suffix, spelling."
    cross_check: "appraisal.borrower_name ⊇ engagement borrower + co-borrower (normalized)"
    sources: [{doc: appraisal, fields: [borrower_name]}, {doc: engagement, fields: [borrower_name, coborrower_name]}]
    reject_as:
      - "Please include Co-borrower name ______ as per order form."
      - "Borrower name middle name / suffix (JR/SR) should be reflected in the report."

  - id: "1"
    item: "Owner of Public Record"
    rule_id: S-3
    also: [S-2]
    check_type: same_section
    llm_role: none
    requirement: "Provided and current. On a Refinance, if owner ≠ borrower a comment is required."
    cross_check: "if assignment==refinance and owner_name != borrower_name → comment required"
    sources: [{doc: appraisal, fields: [owner_of_record, borrower_name, assignment_type, subject_comments]}]
    reject_as:
      - "Assignment type of the report is noted as 'Refinance'; however, the owner name and the borrower name are different, please revise or comment."

  - id: "2"
    item: "Legal Description"
    rule_id: S-4a
    check_type: presence
    llm_role: none
    requirement: "Must not be blank."
    sources: [{doc: appraisal, fields: [legal_description]}]
    reject_as: ["The legal description is incomplete. Please provide the full legal description."]

  - id: "3"
    item: "Assessor's Parcel #"
    rule_id: S-4b
    check_type: presence
    llm_role: none
    requirement: "Must not be blank; plausible for the state."
    sources: [{doc: appraisal, fields: [apn]}]
    reject_as: ["The parcel number doesn't look right for {state}. Please verify the APN."]

  - id: "4"
    item: "Tax Year"
    rule_id: S-4d
    check_type: format
    llm_role: none
    requirement: "Current or within last 2 years; not blank."
    sources: [{doc: appraisal, fields: [tax_year]}]
    reject_as: ["The tax year is outdated — should be current or at most 2 years old. Please update."]

  - id: "5"
    item: "R.E. Taxes $"
    rule_id: S-4c
    check_type: format
    llm_role: none
    requirement: "Whole dollars (no decimals); not blank."
    sources: [{doc: appraisal, fields: [re_taxes]}]
    reject_as: ["Real estate taxes should be a whole dollar amount (no cents). Please remove the decimal."]

  - id: "6"
    item: "Neighborhood Name"
    rule_id: S-5
    check_type: format
    llm_role: none
    requirement: "Subdivision or common area name; cannot be blank/None/N/A/Unknown."
    sources: [{doc: appraisal, fields: [neighborhood_name]}]
    reject_as:
      - "The neighborhood name is listed as N/A. Please enter a real neighborhood name (subdivision, municipality, or the name residents commonly use). Please revise."

  - id: "7"
    item: "Map Reference"
    rule_id: S-6b
    check_type: format
    llm_role: none
    requirement: "Provided and numeric."
    sources: [{doc: appraisal, fields: [map_reference]}]
    reject_as: ["Map Reference must be a number — please provide it."]

  - id: "8"
    item: "Census Tract"
    rule_id: S-6
    check_type: format
    llm_role: none
    requirement: "Format 1234.56 (four digits, decimal, two digits)."
    sources: [{doc: appraisal, fields: [census_tract]}]
    reject_as: ["Census Tract must be in the format 1234.56 — please provide it."]

  - id: "9"
    item: "Occupant"
    rule_id: S-7
    also: [~]
    check_type: cross_modal
    llm_role: read_fact
    requirement: "Marked; tenant→lease dates/amount; vacant→utilities note; occupancy must match photos."
    cross_check: "subject.occupancy vs what the interior/exterior photos show"
    sources: [{doc: appraisal, fields: [occupancy_status, subject_comments], photos: [subject_interior, subject_exterior]}]
    reject_as:
      - "The subject section indicates owner occupied but the photos appear to show the property is vacant. Please revise or comment."
      - "Occupancy is marked vacant but photos appear occupied. Please revise or comment if it is a staged home."

  - id: "10"
    item: "Special Assessments"
    rule_id: S-8
    check_type: presence
    llm_role: none
    requirement: "If present, comment amount + purpose; if none, must be '0'."
    sources: [{doc: appraisal, fields: [special_assessment, subject_comments]}]
    reject_as: ["Please specify what the special assessment of ${value} is for."]

  - id: "11"
    item: "PUD and HOA"
    rule_id: S-9
    also: [I-HOA-PUD]
    check_type: same_section
    llm_role: none
    requirement: "Mandatory HOA dues ⇒ PUD box marked; per-year/per-month noted."
    cross_check: "if hoa_dues present and PUD not marked → reject"
    sources: [{doc: appraisal, fields: [hoa_dues, pud_flag]}]
    reject_as: ["HOA dues of ${value}/year are shown but the PUD box is not marked. Please revise."]

  - id: "E"
    item: "Lender/Client Name"
    rule_id: S-10a
    check_type: cross_document
    llm_role: none
    requirement: "Must match lender/client name on the engagement letter."
    cross_check: "appraisal.lender_name == engagement.lender_name (normalized)"
    sources: [{doc: appraisal, fields: [lender_name]}, {doc: engagement, fields: [lender_name]}]
    reject_as: ["Please correct the lender's name to: {value}"]

  - id: "F"
    item: "Lender/Client Address"
    rule_id: S-10b
    check_type: cross_document
    llm_role: none
    requirement: "Must match lender/client address on the engagement letter."
    cross_check: "appraisal.lender_address == engagement.lender_address (normalized)"
    sources: [{doc: appraisal, fields: [lender_address]}, {doc: engagement, fields: [lender_address]}]
    reject_as: ["Please correct the lender's address to: {value}"]

  - id: "12"
    item: "Property Rights Appraised"
    rule_id: S-11
    check_type: presence
    llm_role: none
    requirement: "Exactly one box (Fee Simple / Leasehold) marked."
    sources: [{doc: appraisal, fields: [property_rights]}]
    reject_as: ["Property rights are not marked. Please select Fee Simple or Leasehold."]

  - id: "13-NO"
    item: "Subject listed/sold in 12 months — marked NO"
    rule_id: S-12
    check_type: presence
    llm_role: none
    requirement: "If no listing/sale, mark No AND include the data source (abbreviated MLS)."
    sources: [{doc: appraisal, fields: [prior_listing_flag, prior_listing_data_source]}]
    reject_as:
      - "Please provide the data source for 'Is the subject currently offered for sale or offered in the prior 12 months?' per UAD."

  - id: "13-YES"
    item: "Subject listed/sold in 12 months — marked YES"
    rule_id: S-12
    also: [LISTING-CMNT]
    check_type: format
    llm_role: none
    requirement: "Format: DOM #; abbreviated MLS + MLS #; current list/sale price + date (page 1). If listed (not sale) and value differs from list by >3%, comment."
    sources: [{doc: appraisal, fields: [prior_listing_details, appraised_value]}]
    reject_as: ["The property was listed in the past 12 months. Please add the listing details (DOM, list date, list price, MLS #)."]

  # ───────────────────────────── CONTRACT SECTION ────────────────────────────
  - id: "14"
    item: "Did / Did Not analyze contract box"
    rule_id: C-1
    also: [C-ANALYZE]
    check_type: cross_document
    llm_role: none
    requirement: "Purchase ⇒ contract section filled + analysis explained. Refinance ⇒ contract section blank + 'did not' box checked."
    cross_check: "assignment_type vs contract-section fill state"
    sources: [{doc: appraisal, fields: [assignment_type, contract_analyzed_flag, contract_price, contract_date]}]
    reject_as:
      - "This is a refinance — the contract section should be left blank per UAD. Please revise."

  - id: "15,16"
    item: "Contract Price & Date of Contract"
    rule_id: C-2a
    also: [C-2b]
    check_type: cross_document
    llm_role: none
    requirement: "Contract price and date must match the purchase agreement."
    cross_check: "appraisal.contract_price/date == contract.price/date"
    sources: [{doc: appraisal, fields: [contract_price, contract_date]}, {doc: contract, fields: [price, date]}]
    reject_as:
      - "The contract price in the appraisal (${a}) doesn't match the purchase contract (${b}). Please verify."
      - "The contract date in the appraisal doesn't match the purchase contract. Please verify."

  - id: "17"
    item: "Data Source(s) — seller is owner of public record?"
    rule_id: C-3
    check_type: presence
    llm_role: none
    requirement: "Data source compulsory when the owner-of-record checkbox is Yes."
    sources: [{doc: appraisal, fields: [seller_is_owner_flag, contract_data_source]}]
    reject_as: ["Please provide the data source for 'Is the property seller the owner of public record?' under the contract section."]

  - id: "18"
    item: "Financial assistance / concessions"
    rule_id: C-4
    check_type: cross_document
    llm_role: none
    requirement: "If Yes, report total $ + describe items (from purchase agreement); if No, apply '0'. Must match the purchase agreement."
    cross_check: "appraisal.concessions == contract.concessions"
    sources: [{doc: appraisal, fields: [concessions_flag, concessions_amount]}, {doc: contract, fields: [concessions]}]
    reject_as:
      - "The purchase agreement shows the concession as ${b}, however the report shows ${a}. Please verify."

  # ─────────────────────────── NEIGHBORHOOD SECTION ──────────────────────────
  - id: "19&20"
    item: "Characteristics & One-Unit Housing Trends"
    rule_id: N-1
    also: [N-2]
    check_type: presence
    llm_role: none
    requirement: "At least one box checked in each Characteristics and Housing Trends group."
    sources: [{doc: appraisal, fields: [neighborhood_characteristics, housing_trends]}]
    reject_as: ["In the neighborhood section a checkbox is missing for ______. Please revise."]

  - id: "21"
    item: "One-Unit Housing Price and Age"
    rule_id: N-3
    check_type: cross_section
    llm_role: none
    requirement: "Comp unadjusted sale prices fall within the stated range; comment if market value differs from predominant by >10%; trend matches MC form."
    cross_check: "comp sale prices within N-3 low/high; predominant vs value delta"
    sources: [{doc: appraisal, fields: [price_range_low, price_range_high, predominant_value, appraised_value]}]
    reject_as: ["One or more comparable prices fall outside the stated One-Unit Housing price range. Please verify or comment."]

  - id: "22"
    item: "Present Land Use %"
    rule_id: N-4
    check_type: same_section
    llm_role: none
    requirement: "Land use % must sum to 100; if 'Other' has a value it needs a description."
    cross_check: "sum(land_use_*) == 100"
    sources: [{doc: appraisal, fields: [land_use_one_unit, land_use_2_4_unit, land_use_multi_family, land_use_commercial, land_use_other]}]
    reject_as: ["The sum of present land use in the neighborhood section should be 100%. Please verify and revise."]

  - id: "23"
    item: "Neighborhood Boundaries"
    rule_id: N-5
    check_type: presence
    llm_role: none
    requirement: "All four boundaries (N/S/E/W) described."
    sources: [{doc: appraisal, fields: [boundary_north, boundary_south, boundary_east, boundary_west]}]
    reject_as: ["The Neighborhood Boundaries must be delineated using North, South, East and West. ______ boundary is missing. Please revise."]

  - id: "24"
    item: "Neighborhood Description"
    rule_id: N-6
    check_type: narrative
    llm_role: classify
    requirement: "Must be filled and specific to the area (not generic/canned)."
    cross_check: "llm: description is property/area-specific vs boilerplate"
    sources: [{doc: appraisal, fields: [neighborhood_description]}]
    reject_as: ["The neighborhood description is missing or too generic. Please provide an area-specific description."]

  - id: "25"
    item: "Market Conditions"
    rule_id: N-7
    also: [N-2]
    check_type: narrative
    llm_role: read_fact
    requirement: "Provide commentary consistent with the 1004MC; 'See 1004MC' is not acceptable. Value trend vs financing-rate trend must be read distinctly."
    cross_check: "page-1 trend == 1004MC trend, corroborated by grounded llm_trend_property_values (llm_comprehension market_trend)"
    sources: [{doc: appraisal, fields: [property_values, mca_trend_median_sale_price, market_conditions_commentary]}]
    reject_as: ["The page-1 housing trend disagrees with the 1004MC. Please reconcile."]

  # ─────────────────────────────── SITE SECTION ──────────────────────────────
  - id: "26-29"
    item: "Dimensions, Area, Shape and View"
    rule_id: ST-1
    also: [ST-2, ST-3, ST-4]
    check_type: format
    llm_role: none
    requirement: "All filled; site area must carry 'sf' or 'ac'."
    sources: [{doc: appraisal, fields: [site_dimensions, site_area, site_shape, site_view]}]
    reject_as: ["Site area must include a unit ('sf' or 'ac'). Please revise."]

  - id: "30"
    item: "Zoning Classification, Description and Compliance"
    rule_id: ST-5
    also: [ST-ZONE-NC]
    check_type: presence
    llm_role: none
    requirement: "One compliance box checked; legal-nonconforming/No-zoning need rebuild commentary; illegal ⇒ HOLD; classification+description not blank."
    sources: [{doc: appraisal, fields: [zoning_compliance, zoning_classification, zoning_description, zoning_comments]}]
    reject_as: ["Zoning Compliance is marked 'No Zoning'; please comment whether the subject can be rebuilt if destroyed."]

  - id: "31"
    item: "Highest and Best Use"
    rule_id: ST-6
    also: [ST-HBU]
    check_type: presence
    llm_role: none
    requirement: "HBU as-improved should be Yes; if No → HOLD."
    sources: [{doc: appraisal, fields: [hbu_as_improved]}]
    reject_as: ["Highest and Best Use is marked No. Please review (HOLD)."]

  - id: "32"
    item: "Utilities / Off-Site Improvement Type"
    rule_id: ST-7
    check_type: presence
    llm_role: none
    requirement: "Gas & Electricity marked; private well/septic ⇒ typicality+marketability comment; private street ⇒ maintenance comment."
    sources: [{doc: appraisal, fields: [util_gas, util_electric, util_water, util_sewer, street_type, site_comments]}]
    reject_as:
      - "Private well and septic system: please comment that it is typical and any impact on marketability and value."
      - "Subject has a 'Private Street'; please comment on its condition and who is responsible for maintenance."

  - id: "33"
    item: "FEMA Flood Hazard Area"
    rule_id: ST-8
    also: [ST-FLOOD-CMT]
    check_type: same_section
    llm_role: none
    requirement: "If in a flood zone, comment on marketability impact."
    sources: [{doc: appraisal, fields: [flood_zone, flood_comments]}]
    reject_as: ["The subject is in a FEMA flood zone. Please comment if it impacts the marketability of the subject."]

  - id: "34"
    item: "Utilities/Off-Site Improvements Typical"
    rule_id: ST-9
    check_type: presence
    llm_role: none
    requirement: "Yes/No checkbox marked."
    sources: [{doc: appraisal, fields: [utilities_typical]}]
    reject_as: ["Please mark whether utilities and off-site improvements are typical for the market area."]

  - id: "35"
    item: "Adverse Site Conditions"
    rule_id: ST-10
    check_type: cross_section
    llm_role: none
    requirement: "If Yes, commentary must support and any adjustment reflected in the sales grid."
    cross_check: "adverse_flag==Yes → comment present AND grid location adjustment present"
    sources: [{doc: appraisal, fields: [adverse_site_flag, site_comments]}, {doc: appraisal, section: sca_grid, fields: [comp_N_location_adj]}]
    reject_as: ["'Adverse site conditions' is answered Yes; a supporting comment should be provided and any adjustment reflected in the grid."]

  # ────────────────────────── IMPROVEMENT SECTION ────────────────────────────
  - id: "36&37"
    item: "General Description / Unit type"
    rule_id: I-1
    also: [~]
    check_type: cross_modal
    llm_role: read_fact
    requirement: "One-unit ⇒ photos/sketch/grid match; One-with-accessory ⇒ ADU reflected in sketch & grid."
    cross_check: "unit_type vs presence of ADU in sketch + grid"
    sources: [{doc: appraisal, fields: [unit_type, improvement_comments], sketch: [adu], sca_grid: [subject_gla]}]
    reject_as: ["Subject is marked 'One with accessory unit' but no accessory unit is noted in the report. Please verify and revise."]

  - id: "38"
    item: "# of Stories"
    rule_id: I-1
    check_type: format
    llm_role: none
    requirement: "Numeric (floors excluding ground level convention)."
    sources: [{doc: appraisal, fields: [stories]}]
    reject_as: ["Number of stories should be numeric. Please revise."]

  - id: "39"
    item: "Type (Existing / Proposed / Under Construction)"
    rule_id: I-1
    also: [~]
    check_type: cross_modal
    llm_role: read_fact
    requirement: "Existing ⇒ 100% complete/livable; Under Construction should be marked if photos show work in progress."
    cross_check: "type vs completion evidenced in photos"
    sources: [{doc: appraisal, fields: [improvement_type], photos: [subject]}]
    reject_as: ["Photos suggest construction is in progress but the type is not marked 'Under Construction'. Please verify."]

  - id: "40"
    item: "Design (Style)"
    rule_id: I-34
    check_type: presence
    llm_role: none
    requirement: "Structural build type provided."
    sources: [{doc: appraisal, fields: [design_style]}]
    reject_as: ["Please provide the Design (Style) in the improvement section."]

  - id: "41"
    item: "Year Built"
    rule_id: I-YRBUILT
    check_type: format
    llm_role: none
    requirement: "Numeric; consistent with actual age."
    sources: [{doc: appraisal, fields: [year_built, actual_age]}]
    reject_as: ["Year built should be numeric and consistent with actual age. Please verify."]

  - id: "42"
    item: "Effective Age (Yrs)"
    rule_id: I-AGE
    check_type: cross_section
    llm_role: none
    requirement: "Numeric; must not exceed actual age; low eff-age vs old actual needs described updates."
    cross_check: "effective_age <= actual_age; low eff-age ⇒ updates described (see XF-AGE-UPDATES)"
    sources: [{doc: appraisal, fields: [effective_age, actual_age, year_built, condition_comments]}]
    reject_as: ["Effective age should be numeric and not exceed actual age. Please verify."]

  - id: "43"
    item: "Attic"
    rule_id: ~
    check_type: cross_modal
    llm_role: read_fact
    requirement: "At least one Attic box checked; if an attic photo exists but 'None' is marked, reject."
    cross_check: "attic checkbox vs presence of an attic photo"
    sources: [{doc: appraisal, fields: [attic_marked], photos: [attic]}]
    reject_as: ["A photo of the attic is provided but the attic box is not marked in the improvement section. Please verify."]

  - id: "44"
    item: "Foundation"
    rule_id: I-2
    also: [SCA-18]
    check_type: cross_section
    llm_role: none
    requirement: "Foundation box marked; full/partial basement ⇒ basement area + finished shown; walkout ⇒ grid shows WO/WU."
    cross_check: "improvement basement type vs grid basement lines"
    sources: [{doc: appraisal, fields: [foundation_type, basement_area, basement_finish]}, {doc: appraisal, section: sca_grid, fields: [subject_basement]}]
    reject_as: ["Outside Entry/Exit is checked; the Basement & Finished area in the sales grid should reflect 'WO' or 'WU'. Please revise."]

  - id: "45&46"
    item: "Exterior/Interior Description + Amenities"
    rule_id: I-34
    also: [SCA-22]
    check_type: cross_section
    llm_role: none
    requirement: "Material & condition completed; amenities (fireplace, patio/deck, pool, woodstove, fence, porch) marked ⇒ reflected in grid."
    cross_check: "improvement amenities vs grid amenity lines"
    sources: [{doc: appraisal, fields: [exterior_desc, interior_desc, amenities]}, {doc: appraisal, section: sca_grid, fields: [subject_amenities]}]
    reject_as: ["Amenities marked in the improvement section are not reflected in the sales grid. Please revise."]

  - id: "47"
    item: "Appliances"
    rule_id: I-6
    check_type: presence
    llm_role: none
    requirement: "Built-in items noted."
    sources: [{doc: appraisal, fields: [appliances]}]
    reject_as: ["Please report the built-in appliances."]

  - id: "48"
    item: "Above Grade Contains (Rooms/Bedrooms/Baths/GLA)"
    rule_id: I-7
    also: [SCA-17]
    check_type: cross_modal
    llm_role: read_fact
    requirement: "Filled and consistent with sketch, photos and sales grid."
    cross_check: "improvement room/GLA == sketch == grid subject column"
    sources: [{doc: appraisal, fields: [room_count, bedrooms, bathrooms, gla], sketch: [sketch_gla], sca_grid: [subject_grid_gla, subject_grid_room_count]}]
    reject_as: ["The GLA/room count in the improvement section, sketch, and sales grid do not agree. Please reconcile."]

  - id: "49"
    item: "Additional Features"
    rule_id: I-8
    check_type: presence
    llm_role: none
    requirement: "List energy-efficient items; if none, state NONE."
    sources: [{doc: appraisal, fields: [additional_features]}]
    reject_as: ["Please describe additional/energy-efficient features, or state NONE."]

  - id: "50"
    item: "Condition of the Property"
    rule_id: I-9
    also: [~]
    check_type: cross_modal
    llm_role: read_fact
    requirement: "UAD compliant (C3/C4…); must match photos, commentary, and be supported by effective age."
    cross_check: "condition_rating consistent with photos + described updates + effective_age"
    sources: [{doc: appraisal, fields: [condition_rating, condition_comments, effective_age], photos: [subject_interior]}]
    reject_as: ["The condition rating is not supported by the photos / commentary / effective age. Please reconcile or comment."]

  - id: "51"
    item: "Adverse / physical deficiency conditions"
    rule_id: I-10
    check_type: presence
    llm_role: none
    requirement: "Checkbox marked; Yes ⇒ addressed."
    sources: [{doc: appraisal, fields: [adverse_conditions_flag, improvement_comments]}]
    reject_as: ["Please mark and address physical deficiencies / adverse conditions affecting livability, soundness, or structural integrity."]

  - id: "52"
    item: "Conforms to Neighborhood"
    rule_id: I-11
    check_type: presence
    llm_role: none
    requirement: "Yes/No checkbox marked."
    sources: [{doc: appraisal, fields: [conforms_flag]}]
    reject_as: ["Please mark whether the property conforms to the neighborhood."]

  # ────────────────────── SALES COMPARISON APPROACH ──────────────────────────
  - id: "53"
    item: "# Comparable Properties Currently Offered (top of page)"
    rule_id: ~
    also: [N-3]
    check_type: same_section
    llm_role: none
    requirement: "Top-of-page-4 low-to-high price range + # currently offered must be filled and ordered low→high."
    cross_check: "top_of_page range present and low <= high"
    sources: [{doc: appraisal, section: sca_grid, fields: [offered_range_low, offered_range_high, offered_count]}]
    reject_as: ["Please provide the low-to-high price range & # of properties currently offered at the top of page 4 above the sales comparison approach."]

  - id: "54"
    item: "# Comparable Sales w/in 12 Months"
    rule_id: SCA-2
    also: [SCA-DC, ADD-5]
    check_type: cross_section
    llm_role: none
    requirement: "Competing sales only; range consistent with comps and the 1004MC / page-1 predominant range."
    cross_check: "grid sales count/range == 1004MC settled totals"
    sources: [{doc: appraisal, section: sca_grid, fields: [sales_count]}, {doc: appraisal, fields: [mca_total_sales]}]
    reject_as: ["The comparable-sales count/range does not agree with the 1004MC. Please verify."]

  - id: "55"
    item: "Comp Address"
    rule_id: SCA-3
    also: [~]
    check_type: cross_modal
    llm_role: read_fact
    requirement: "Subject + all comp addresses on grid and consistent with the location map."
    cross_check: "grid comp addresses == location map pins"
    sources: [{doc: appraisal, section: sca_grid, fields: [comp_N_address], maps: [location_map]}]
    reject_as: ["Please update the property address on the sales grid / location map so it reflects ______."]

  - id: "56"
    item: "Proximity to Subject"
    rule_id: SCA-4
    check_type: format
    llm_role: none
    requirement: "≥0.01 miles + direction (N/S/NW…); if blank, verify location map."
    sources: [{doc: appraisal, section: sca_grid, fields: [comp_N_proximity]}]
    reject_as: ["Please provide proximity (distance + direction) for comp #___."]

  - id: "57"
    item: "Comp Data Sources"
    rule_id: SCA-5
    check_type: format
    llm_role: none
    requirement: "Specific MLS + #; DOM provided or 'Unk' with commentary."
    sources: [{doc: appraisal, section: sca_grid, fields: [comp_N_data_source]}]
    reject_as: ["Please provide the data source for comp #___ under the sales grid section."]

  - id: "58"
    item: "Comp Verification Sources"
    rule_id: SCA-6
    check_type: format
    llm_role: none
    requirement: "At least one specific verification source reported in full."
    sources: [{doc: appraisal, section: sca_grid, fields: [comp_N_verification_source]}]
    reject_as: ["Please provide the verification source for comp #___ under the sales grid section."]

  - id: "59"
    item: "Sale or Financing Concessions"
    rule_id: SCA-7
    also: [CG-CONC-DIR]
    check_type: same_section
    llm_role: none
    requirement: "Concession amount given ⇒ adjustment applied (not blank/0 without comment); direction correct."
    sources: [{doc: appraisal, section: sca_grid, fields: [comp_N_concession, comp_N_concession_adj]}]
    reject_as: ["Please provide the 'Sales or Financing Concessions' adjustment for comp 1, or comment why an adjustment is not warranted."]

  - id: "60"
    item: "Date of Sale/Time (S/C sequencing)"
    rule_id: SCA-8
    check_type: format
    llm_role: none
    requirement: "Sale date (S) must not be prior to closing date (C)."
    sources: [{doc: appraisal, section: sca_grid, fields: [comp_N_sale_date, comp_N_close_date]}]
    reject_as: ["Please verify the 'Date of Sale/Time' for comp #1 — the sale date (S) is prior to the closing date (C)."]

  - id: "61"
    item: "Location (N/B/A + adjustment sign)"
    rule_id: SCA-9
    also: [CG-NET-BIAS]
    check_type: cross_section
    llm_role: none
    requirement: "One of N/B/A; if subject Adverse and a comp Neutral, the value adjustment must be negative."
    cross_check: "subject location vs comp location → adjustment sign"
    sources: [{doc: appraisal, section: sca_grid, fields: [subject_location, comp_N_location, comp_N_location_adj]}]
    reject_as: ["Comp location vs subject implies a negative adjustment that is not reflected. Please verify."]

  - id: "62"
    item: "Leasehold/Fee Simple"
    rule_id: SCA-10
    check_type: cross_section
    llm_role: none
    requirement: "Grid rights must reflect the subject's Property Rights; leasehold subject with fee-simple comps ⇒ adjustment."
    cross_check: "subject.property_rights == grid property rights"
    sources: [{doc: appraisal, fields: [property_rights]}, {doc: appraisal, section: sca_grid, fields: [comp_N_rights, comp_N_rights_adj]}]
    reject_as: ["The sales grid property rights do not reflect the subject's Property Rights Appraised. Please revise."]

  - id: "63"
    item: "Comp Site (unit by size)"
    rule_id: SCA-11
    check_type: format
    llm_role: none
    requirement: "<1 acre in SF; ≥1 acre in acreage."
    sources: [{doc: appraisal, section: sca_grid, fields: [comp_N_site]}]
    reject_as: ["Comp site size must be in SF (<1 ac) or acreage (≥1 ac). Please revise."]

  - id: "64"
    item: "Comp View"
    rule_id: SCA-12
    also: [~]
    check_type: cross_modal
    llm_role: read_fact
    requirement: "UAD format; if Beneficial (B) or Adverse (A), a photo must support it."
    cross_check: "comp view rating vs supporting photo"
    sources: [{doc: appraisal, section: sca_grid, fields: [comp_N_view], photos: [comp_N]}]
    reject_as: ["View is described as B/A for comp #___ but no supporting photo is provided. Please provide."]

  - id: "65"
    item: "Design (Style) in grid"
    rule_id: SCA-13
    check_type: cross_section
    llm_role: none
    requirement: "Attachment type, # stories, and Design present in improvement + grid."
    sources: [{doc: appraisal, section: sca_grid, fields: [comp_N_design]}, {doc: appraisal, fields: [design_style]}]
    reject_as: ["Please provide Design (style) under the improvement section and sales grid."]

  - id: "66"
    item: "Quality of Construction"
    rule_id: SCA-14
    check_type: same_section
    llm_role: none
    requirement: "UAD (Q3/Q4…); subject↔comp difference not adjusted needs a 0 + commentary."
    sources: [{doc: appraisal, section: sca_grid, fields: [subject_quality, comp_N_quality, comp_N_quality_adj]}]
    reject_as: ["A quality difference for comp #___ is not adjusted; please add a 0 and commentary explaining why."]

  - id: "67"
    item: "Actual Age vs Year Built"
    rule_id: SCA-15
    check_type: cross_section
    llm_role: none
    requirement: "Grid actual age consistent with improvement year built."
    cross_check: "improvement year_built → implied age == grid actual age"
    sources: [{doc: appraisal, fields: [year_built]}, {doc: appraisal, section: sca_grid, fields: [subject_actual_age]}]
    reject_as: ["Per the improvement section the subject's year built implies an actual age that differs from the grid. Please verify."]

  - id: "68"
    item: "Comp Condition"
    rule_id: SCA-16
    also: [CG-COND-CONSIST]
    check_type: cross_modal
    llm_role: read_fact
    requirement: "Condition rating consistent with photos; differences across comps adjusted or commented."
    cross_check: "comp condition ratings consistent + adjustments present"
    sources: [{doc: appraisal, section: sca_grid, fields: [comp_N_condition, comp_N_condition_adj], photos: [comp_N]}]
    reject_as: ["Please provide a condition adjustment for comps #2, 3 and 4, or comment why it was not warranted."]

  - id: "69"
    item: "Above Grade / Room count / GLA"
    rule_id: SCA-17
    check_type: cross_modal
    llm_role: read_fact
    requirement: "Rooms & GLA match sketch; unadjusted subject↔comp differences need a 0 or commentary."
    cross_check: "grid room/GLA == sketch; unadjusted diffs → 0"
    sources: [{doc: appraisal, section: sca_grid, fields: [comp_N_gla, comp_N_gla_adj]}, {doc: appraisal, sketch: [sketch_gla]}]
    reject_as: ["Rooms/GLA do not match the sketch, or an unadjusted difference lacks a 0. Please revise."]

  - id: "70"
    item: "Basement & Finish / Rooms Below Grade"
    rule_id: SCA-18
    check_type: cross_section
    llm_role: none
    requirement: "Improvement full/partial basement ⇒ grid shows basement area + finished on two lines."
    sources: [{doc: appraisal, fields: [foundation_type]}, {doc: appraisal, section: sca_grid, fields: [subject_basement, subject_basement_finish]}]
    reject_as: ["The improvement section marks a basement; the grid must show basement area and finished area on separate lines. Please revise."]

  - id: "71"
    item: "Functional Utility"
    rule_id: SCA-19
    check_type: format
    llm_role: none
    requirement: "Provided as Standard/Average/Typical."
    sources: [{doc: appraisal, section: sca_grid, fields: [comp_N_functional]}]
    reject_as: ["Please provide functional utility (Standard/Average/Typical) in the grid."]

  - id: "72"
    item: "Heating/Cooling"
    rule_id: SCA-20
    check_type: cross_section
    llm_role: none
    requirement: "Both provided and match improvement section; FWBB/FWA/Radiant ⇒ ≥1 comp same; cooling 'Other' ⇒ heat-source comment."
    sources: [{doc: appraisal, fields: [heating, cooling]}, {doc: appraisal, section: sca_grid, fields: [comp_N_heating_cooling]}]
    reject_as: ["Subject property has no permanent heat source; please comment on any impact on marketability."]

  - id: "73"
    item: "Energy Efficient Items"
    rule_id: ~
    check_type: same_section
    llm_role: none
    requirement: "Energy items described; unadjusted subject↔comp differences need a 0."
    sources: [{doc: appraisal, section: sca_grid, fields: [comp_N_energy, comp_N_energy_adj]}]
    reject_as: ["Please describe energy-efficient items, or add a 0 adjustment where they differ from the subject."]

  - id: "74"
    item: "Garage/Carport"
    rule_id: SCA-21
    check_type: cross_section
    llm_role: none
    requirement: "Improvement garage ⇒ grid reflects garage+driveway (e.g. 1ga2dw); differences adjusted or 0."
    sources: [{doc: appraisal, fields: [garage]}, {doc: appraisal, section: sca_grid, fields: [comp_N_garage, comp_N_garage_adj]}]
    reject_as: ["The garage in the improvement section is not reflected in the grid, or a difference is unadjusted. Please revise."]

  - id: "75"
    item: "Porch/Patio/Deck"
    rule_id: SCA-22
    check_type: cross_section
    llm_role: none
    requirement: "Improvement porch/patio/deck ⇒ reflected in grid; differences adjusted or 0."
    sources: [{doc: appraisal, fields: [porch_patio_deck]}, {doc: appraisal, section: sca_grid, fields: [comp_N_porch, comp_N_porch_adj]}]
    reject_as: ["Porch/patio/deck in the improvement section is not reflected in the grid, or a difference is unadjusted. Please revise."]

  - id: "76"
    item: "Additional Fields for use"
    rule_id: ~
    check_type: presence
    llm_role: none
    requirement: "Optional; if used, must be labeled in the proper section."
    sources: [{doc: appraisal, section: sca_grid, fields: [comp_N_additional]}]
    reject_as: ["An additional grid field is used without a label. Please label it in the proper section."]

  - id: "77"
    item: "Net Adjustment (total)"
    rule_id: SCA-NET
    also: [CG-NET-BIAS]
    check_type: same_section
    llm_role: none
    requirement: "|Net adjustment| generally ≤ 15% of comp sale price."
    sources: [{doc: appraisal, section: sca_grid, fields: [comp_N_sale_price, comp_N_net_adjustment]}]
    reject_as: ["Please address Comp(s) ___ exceeding 15% net adjustments."]

  - id: "78"
    item: "Adjusted Sale Price of Comparables (bracketing)"
    rule_id: SCA-BR
    also: [SCA-PR, SCA-GROSS]
    check_type: same_section
    llm_role: none
    requirement: "Market value bracketed by closed comps' adjusted prices; gross adj ≤ 25%."
    sources: [{doc: appraisal, section: sca_grid, fields: [comp_N_adjusted_sale_price]}, {doc: appraisal, fields: [appraised_value]}]
    reject_as: ["Market Value is not bracketed by the adjusted sale prices of the comps. Please revise accordingly."]

  # ─────────────────────── PRIOR SALES HISTORY SECTION ───────────────────────
  - id: "79"
    item: "Research the sale/transfer history"
    rule_id: SCA-PSH
    check_type: presence
    llm_role: none
    requirement: "'I did research…' must be marked for subject and comparables."
    sources: [{doc: appraisal, fields: [psh_research_flag]}]
    reject_as: ["Please mark 'I did research the sale or transfer history of the subject and comparable sales'."]

  - id: "80"
    item: "Subject 3-year sales/transfer history"
    rule_id: CG-PRIOR-SALE
    also: [SCA-PSH]
    check_type: cross_section
    llm_role: none
    requirement: "If subject transferred within 36 months, the 'Did' box must be marked + date/price provided."
    cross_check: "detected prior transfer vs 'Did' box + date/price presence"
    sources: [{doc: appraisal, fields: [subject_prior_sale_date, subject_prior_sale_price, psh_subject_flag]}]
    reject_as: ["Prior Sales: please check the 'Did' box for subject prior sales/transfers — your data revealed a transfer within three years."]

  - id: "81"
    item: "Comparables 12-month sales/transfer history"
    rule_id: CG-PRIOR-SALE
    check_type: cross_section
    llm_role: none
    requirement: "If a comp transferred within 12 months, the 'Did' box must be marked + details."
    sources: [{doc: appraisal, section: sca_grid, fields: [comp_N_prior_sale_date]}]
    reject_as: ["Please check the 'Did' box for comparable prior sales — a comp transferred within the prior year."]

  - id: "82"
    item: "Sales History Table (date)"
    rule_id: SCA-PSH
    check_type: format
    llm_role: none
    requirement: "mm/dd/yyyy; only most recent (commentary if >1); blank if none."
    sources: [{doc: appraisal, fields: [prior_sale_date]}]
    reject_as: ["Prior sale/transfer date should be mm/dd/yyyy; only the most recent should be reported (comment if more than one)."]

  - id: "83"
    item: "Price of Prior Sale/Transfer"
    rule_id: SCA-PSH
    check_type: presence
    llm_role: none
    requirement: "Most recent figure; commentary if >1."
    sources: [{doc: appraisal, fields: [prior_sale_price]}]
    reject_as: ["Please provide the most recent prior sale/transfer figure (comment if more than one)."]

  - id: "84"
    item: "Data Source(s)"
    rule_id: SCA-PSH
    check_type: presence
    llm_role: none
    requirement: "Provided even if no sale (Public Record Doc # or MLS name+#)."
    sources: [{doc: appraisal, fields: [psh_data_source]}]
    reject_as: ["Please provide the prior-sales data source (e.g. MFRMLS #T2321256), even if no sale is reported."]

  - id: "85"
    item: "Effective Date of Data Source(s)"
    rule_id: ~
    check_type: presence
    llm_role: none
    requirement: "Date of findings; provided even if no sale."
    sources: [{doc: appraisal, fields: [psh_data_source_date]}]
    reject_as: ["Please provide the effective date of the prior-sales data source."]

  - id: "86"
    item: "Analysis of prior sales or transfers"
    rule_id: SCA-PSH-Q
    check_type: narrative
    llm_role: classify
    requirement: "Substantive analysis, not a boilerplate pointer."
    cross_check: "llm: analysis is substantive vs canned/pointer"
    sources: [{doc: appraisal, fields: [prior_sale_analysis_comment]}]
    reject_as: ["The analysis of prior sales appears to be a pointer/boilerplate. Please provide a substantive analysis."]

  - id: "87"
    item: "Summary of Sales Comparison Approach"
    rule_id: ADD-2
    also: [SCA-PSH-Q]
    check_type: narrative
    llm_role: classify
    requirement: "Discuss comps specifically; address distant comps and adjustments; value bracketed by unadjusted+adjusted prices."
    cross_check: "llm: summary specifically discusses the comps vs generic"
    sources: [{doc: appraisal, fields: [sales_comparison_summary]}]
    reject_as: ["The Summary of Sales Comparison Approach is generic. Please specifically discuss the comparables, distant comps, and adjustments."]

  - id: "88"
    item: "Indicated Value by Sales Comparison"
    rule_id: R-1
    also: [VAL-1]
    check_type: cross_section
    llm_role: none
    requirement: "Provided and matches the final value."
    cross_check: "sca_indicated_value == final_value"
    sources: [{doc: appraisal, fields: [sca_indicated_value, final_value]}]
    reject_as: ["The indicated value by sales comparison must be provided and match the final value."]

  # ───────────────────────── RECONCILIATION SECTION ──────────────────────────
  - id: "89&90"
    item: "Indicated Value vs As-Is Value"
    rule_id: R-1
    check_type: cross_section
    llm_role: none
    requirement: "Indicated Value by SCA and As-Is value must be the same."
    cross_check: "sca_indicated_value == as_is_value"
    sources: [{doc: appraisal, fields: [sca_indicated_value, as_is_value]}]
    reject_as: ["In the reconciliation section, the Indicated Market Value does not match the indicated value by the Sales Comparison Approach. Please revise."]

  - id: "91"
    item: "Appraisal: As-Is or Subject-To"
    rule_id: R-2
    check_type: presence
    llm_role: none
    requirement: "At least one box; subject-to ⇒ itemized repairs + cost-to-cure."
    sources: [{doc: appraisal, fields: [as_is_flag, subject_to_flag, repair_list]}]
    reject_as: ["Please check 'As Is' or 'Subject To'; if Subject To, provide an itemized list of repairs with estimated cost to cure for each."]

  - id: "92"
    item: "Support for Opinion of Site Value"
    rule_id: CA-1
    check_type: presence
    llm_role: none
    requirement: "Opinion of Site Value required in every report."
    sources: [{doc: appraisal, fields: [site_value]}]
    reject_as: ["Please provide an Opinion of Site Value in the report."]

  - id: "93"
    item: "Estimated Remaining Economic Life (HUD/VA only)"
    rule_id: FHA-10
    check_type: format
    llm_role: none
    requirement: "Not less than 30 years (HUD/VA)."
    sources: [{doc: appraisal, fields: [remaining_economic_life, loan_type]}]
    reject_as: ["Remaining economic life must be at least 30 years for HUD/VA. Please revise."]

  - id: "94"
    item: "Income Approach to Value"
    rule_id: R-INCOME-REQ
    also: [MF-1]
    check_type: presence
    llm_role: none
    requirement: "If blank, no revision needed (unless required by product/multi-family)."
    sources: [{doc: appraisal, fields: [income_approach_value, property_type]}]
    reject_as: ["The income approach is required for this product/property type. Please complete it."]

  # ──────────────────────────── PUD INFORMATION ──────────────────────────────
  - id: "95"
    item: "Is Developer/builder in control?"
    rule_id: I-HOA-PUD
    also: [~]
    check_type: same_section
    llm_role: none
    requirement: "PUD reports: Yes/No + Attached/Detached; attached+yes ⇒ full PUD info completed."
    sources: [{doc: appraisal, fields: [pud_developer_control, pud_attached, pud_info_complete]}]
    reject_as: ["This is a PUD; please complete the PUD information section (developer control, attached/detached, unit counts)."]

  # ─────────────────────── APPRAISER'S SIGNATURE PAGE ────────────────────────
  - id: "96"
    item: "Appraiser signed"
    rule_id: SIG-1
    check_type: presence
    llm_role: none
    requirement: "All reports signed by a certified appraiser."
    sources: [{doc: appraisal, fields: [appraiser_signature]}]
    reject_as: ["The appraiser signatures are missing throughout the report. Please sign in all designated spaces."]

  - id: "G"
    item: "Appraiser Name"
    rule_id: SIG-1
    also: [~]
    check_type: cross_document
    llm_role: none
    requirement: "Appraiser name matches the engagement letter."
    cross_check: "appraisal.appraiser_name == engagement.appraiser_name"
    sources: [{doc: appraisal, fields: [appraiser_name]}, {doc: engagement, fields: [appraiser_name]}]
    reject_as: ["The appraiser name does not match the engagement letter. Please verify."]

  - id: "97"
    item: "Company Name (appraiser)"
    rule_id: ~
    check_type: cross_document
    llm_role: none
    requirement: "Should match the engagement letter."
    sources: [{doc: appraisal, fields: [appraiser_company]}, {doc: engagement, fields: [appraiser_company]}]
    reject_as: ["The appraiser company name does not match the engagement letter. Please verify."]

  - id: "98"
    item: "Company Address (appraiser)"
    rule_id: ~
    check_type: cross_document
    llm_role: none
    requirement: "Should match the engagement letter."
    sources: [{doc: appraisal, fields: [appraiser_company_address]}, {doc: engagement, fields: [appraiser_company_address]}]
    reject_as: ["The appraiser company address does not match the engagement letter. Please verify."]

  - id: "99"
    item: "Telephone number"
    rule_id: ~
    check_type: cross_document
    llm_role: none
    requirement: "Should match the engagement letter."
    sources: [{doc: appraisal, fields: [appraiser_phone]}, {doc: engagement, fields: [appraiser_phone]}]
    reject_as: ["The appraiser telephone number does not match the engagement letter. Please verify."]

  - id: "100"
    item: "Email Address (appraiser)"
    rule_id: SIG-4
    check_type: presence
    llm_role: none
    requirement: "Present."
    sources: [{doc: appraisal, fields: [appraiser_email]}]
    reject_as: ["The appraiser email address is missing. Please provide it."]

  - id: "101&102"
    item: "Date of Signature & Effective Date of Appraisal"
    rule_id: SIG-D
    check_type: same_section
    llm_role: none
    requirement: "Both present, valid format; signature date ≥ effective date."
    cross_check: "signature_date >= effective_date"
    sources: [{doc: appraisal, fields: [signature_date, effective_date]}]
    reject_as: ["Please correct the 'Date of signature and report' on the signature page — it should be greater than or equal to the effective date."]

  - id: "103"
    item: "State Certification # / Expiration"
    rule_id: DOC-1
    also: [SIG-3]
    check_type: cross_document
    llm_role: none
    requirement: "Matches the attached license; current at signature."
    sources: [{doc: appraisal, fields: [cert_number, cert_expiration, signature_date]}]
    reject_as: ["Please provide an updated copy of your license — the copy provided has expired at the signature date."]

  - id: "104"
    item: "State License #"
    rule_id: SIG-3
    check_type: format
    llm_role: none
    requirement: "Matches ASC.gov; product type permitted for a licensed appraiser."
    sources: [{doc: appraisal, fields: [license_number]}]
    reject_as: ["Please verify the state license number reads as it does on ASC.gov."]

  - id: "105"
    item: "State (of license)"
    rule_id: SIG-3
    check_type: cross_section
    llm_role: none
    requirement: "License state must match the subject property state."
    cross_check: "license_state == property_state"
    sources: [{doc: appraisal, fields: [license_state, property_state]}]
    reject_as: ["The appraiser's license state must match the subject property state. Please verify."]

  - id: "106"
    item: "Expiration Date of Certification/License"
    rule_id: DOC-1
    check_type: format
    llm_role: none
    requirement: "Valid date; matches attached license."
    sources: [{doc: appraisal, fields: [cert_expiration]}]
    reject_as: ["Please verify the certification/license expiration date matches the attached license."]

  - id: "107"
    item: "Address of Property Appraised (sig page)"
    rule_id: S-1
    check_type: cross_document
    llm_role: none
    requirement: "Same as engagement letter / subject section."
    cross_check: "sig_page_address == subject_address == engagement_address"
    sources: [{doc: appraisal, fields: [sig_page_address, property_address]}]
    reject_as: ["The property address on the signature page does not match the subject/engagement address. Please verify."]

  - id: "108"
    item: "Appraised Value of Subject Property $"
    rule_id: VAL-1
    also: [R-1]
    check_type: cross_section
    llm_role: none
    requirement: "Matches the reconciliation section."
    cross_check: "sig_page_value == reconciliation_value"
    sources: [{doc: appraisal, fields: [sig_page_value, final_value]}]
    reject_as: ["The appraised value on the signature page does not match the reconciliation section. Please verify."]

  - id: "109"
    item: "AMC Name (Lender/Client)"
    rule_id: S-10a
    also: [~]
    check_type: cross_document
    llm_role: none
    requirement: "AMC name required for all reports; must match engagement."
    sources: [{doc: appraisal, fields: [amc_name]}, {doc: engagement, fields: [amc_name]}]
    reject_as:
      - "In the signature card, please include the AMC name: {amc_name}."
      - "In the signature card, please update the AMC name to: {amc_name}."

  - id: "110"
    item: "Company Name (AMC)"
    rule_id: S-10a
    check_type: cross_document
    llm_role: none
    requirement: "Must match the engagement letter (lender/client name)."
    sources: [{doc: appraisal, fields: [amc_company_name]}, {doc: engagement, fields: [lender_name]}]
    reject_as: ["The AMC company name must match the engagement letter. Please verify."]

  - id: "111"
    item: "Company Address (AMC)"
    rule_id: S-10b
    check_type: cross_document
    llm_role: none
    requirement: "Must match the engagement letter (lender/client address)."
    sources: [{doc: appraisal, fields: [amc_company_address]}, {doc: engagement, fields: [lender_address]}]
    reject_as: ["The AMC company address must match the engagement letter. Please verify."]

  - id: "112"
    item: "Email Address (AMC)"
    rule_id: ~
    check_type: presence
    llm_role: none
    requirement: "Not required."
    sources: [{doc: appraisal, fields: [amc_email]}]
    reject_as: []

  # ──────────────────────── MARKET CONDITIONS ADDENDUM ───────────────────────
  - id: "113"
    item: "Inventory Analysis"
    rule_id: ADD-5
    check_type: presence
    llm_role: none
    requirement: "Lightly-shaded areas completed or specifically commented; blanks completed with '0' where none/NA."
    sources: [{doc: appraisal, fields: [mca_inventory_analysis]}]
    reject_as: ["The 1004MC Inventory Analysis has required fields blank. Please complete or comment (use '0' where none)."]

  - id: "114"
    item: "Total # Comparable Sales (Settled)"
    rule_id: ADD-5
    check_type: cross_section
    llm_role: none
    requirement: "Fields must total to the data at the top of the sales grid."
    cross_check: "mca settled totals == grid top-of-page sales"
    sources: [{doc: appraisal, fields: [mca_total_sales]}, {doc: appraisal, section: sca_grid, fields: [offered_count]}]
    reject_as: ["The 1004MC total settled comparables must total to the data at the top of the sales grid. Please reconcile."]

  - id: "115"
    item: "Total # Comparable Active Listings"
    rule_id: ADD-5
    check_type: cross_section
    llm_role: none
    requirement: "If completed, must match the top-of-grid current-offered data; Current-3-months must match."
    sources: [{doc: appraisal, fields: [mca_active_listings]}, {doc: appraisal, section: sca_grid, fields: [offered_count]}]
    reject_as: ["The 1004MC active listings must match the top-of-grid currently-offered data. Please reconcile."]

  - id: "116"
    item: "Median Sale & List Price, DOM, Sale/List %"
    rule_id: ADD-5
    check_type: presence
    llm_role: none
    requirement: "Lightly-shaded completed or commented; blanks '0'; dark-shaded 'N/A' when unavailable."
    sources: [{doc: appraisal, fields: [mca_median_sale_price, mca_median_list_price, mca_dom, mca_sale_list_pct]}]
    reject_as: ["Required 1004MC median/DOM/ratio fields are blank. Please complete or comment."]

  - id: "117"
    item: "Overall Trend"
    rule_id: N-2
    also: [XF-TREND-NARRATIVE]
    check_type: cross_section
    llm_role: read_fact
    requirement: "Trends marked where ≥2 data points; declining/increasing median ⇒ market-conditions adjustment applied or explained."
    cross_check: "mca trend vs applied time adjustment vs narrative (grounded llm trend)"
    sources: [{doc: appraisal, fields: [mca_trend_median_sale_price, property_values, market_conditions_commentary]}, {doc: appraisal, section: sca_grid, fields: [comp_N_time_adj]}]
    reject_as: ["The 1004MC median trend is not flat but no market-conditions time adjustment is applied or explained. Please address."]

  - id: "118"
    item: "1004MC Commentary"
    rule_id: ADD-1
    check_type: narrative
    llm_role: classify
    requirement: "Completed for each section; specific to the report; no canned commentary."
    cross_check: "llm: commentary specific vs canned"
    sources: [{doc: appraisal, fields: [market_conditions_commentary, mc_commentary]}]
    reject_as: ["The market conditions commentary appears canned/generic. Please provide commentary specific to this property and its data."]

  - id: "119"
    item: "Condo/Co-Op Projects"
    rule_id: ~
    check_type: presence
    llm_role: none
    requirement: "If subject is Condo/Co-Op, complete the project-specific shaded areas."
    sources: [{doc: appraisal, fields: [property_type, condo_project_section]}]
    reject_as: ["The subject is a Condo/Co-Op; please complete the project-specific 1004MC areas."]

  - id: "120"
    item: "1004MC Commentary (Condo/Co-Op)"
    rule_id: ADD-1
    check_type: narrative
    llm_role: classify
    requirement: "Specific to the project; no canned commentary."
    cross_check: "llm: commentary specific vs canned"
    sources: [{doc: appraisal, fields: [mc_commentary]}]
    reject_as: ["The condo/co-op market conditions commentary appears canned/generic. Please make it specific to the project."]

  # ───────────────────── USPAP 2014 ADDENDUM w/ REPORT TYPE ──────────────────
  - id: "121"
    item: "Appraisal & Report Identification"
    rule_id: ADD-9
    check_type: presence
    llm_role: none
    requirement: "Completed; only Appraisal Report or Restricted Appraisal Report."
    sources: [{doc: appraisal, fields: [report_type_identification]}]
    reject_as: ["Please complete the USPAP report identification (Appraisal Report or Restricted Appraisal Report)."]

  - id: "122"
    item: "Reasonable Exposure Time"
    rule_id: R-EXPOSURE
    check_type: format
    llm_role: none
    requirement: "Single point or range (e.g. 90 or 30-60)."
    sources: [{doc: appraisal, fields: [exposure_time]}]
    reject_as: ["Reasonable exposure time must be a single point or range (e.g. 90 or 30-60). Please provide."]

  - id: "123"
    item: "Additional Certifications (prior services)"
    rule_id: ST-PRIOR-SVC
    check_type: narrative
    llm_role: none
    requirement: "If 'I HAVE performed services' is checked, state what those prior services are."
    sources: [{doc: appraisal, fields: [prior_services_flag, prior_services_comment]}]
    reject_as: ["The 'I HAVE performed services' box is checked; please state what those prior services are."]

  # ─────────────────────────── PHOTOGRAPH ADDENDUMS ──────────────────────────
  - id: "124"
    item: "Subject Photo Pages"
    rule_id: ~
    check_type: cross_modal
    llm_role: read_fact
    requirement: "At minimum front, rear, street scene; extra photos per engagement; observed obsolescence commented."
    cross_check: "presence of required subject photos + obsolescence → comment"
    sources: [{doc: appraisal, photos: [subject_front, subject_rear, subject_street]}]
    reject_as: ["Required subject photos (front, rear, street scene) are missing. Please provide."]

  - id: "125"
    item: "Interior Photos"
    rule_id: ~
    check_type: cross_modal
    llm_role: read_fact
    requirement: "All rooms (kitchen, living, dining, family, bedrooms, all baths) for interior inspections; deferred maintenance; labeled."
    cross_check: "presence of required interior room photos"
    sources: [{doc: appraisal, photos: [interior]}]
    reject_as: ["Required interior photos (kitchen, living, dining, family, bedrooms, all baths) are missing or unlabeled. Please provide."]

  - id: "126"
    item: "Additional Subject Photos"
    rule_id: ~
    check_type: cross_modal
    llm_role: read_fact
    requirement: "Outbuildings/special features (pools) incl. interiors; exterior obsolescence photos."
    sources: [{doc: appraisal, photos: [outbuildings, special_features]}]
    reject_as: ["Photos of outbuildings/special features (and their interiors) are missing. Please provide."]

  - id: "127"
    item: "Comparable Photos"
    rule_id: ~
    check_type: cross_modal
    llm_role: read_fact
    requirement: "Conventional: MLS photos acceptable with a drive-by commentary statement."
    cross_check: "comp photos present + drive-by statement in narrative"
    sources: [{doc: appraisal, photos: [comp], fields: [comp_photo_commentary]}]
    reject_as: ["Comparable photos are missing, or the drive-by commentary statement is absent. Please provide."]

  # ───────────────────────────── FLOORPLAN SKETCH ────────────────────────────
  - id: "128"
    item: "Sketch"
    rule_id: ~
    also: [SCA-17]
    check_type: cross_modal
    llm_role: read_fact
    requirement: "On the sketch page; all floors; exterior dimensions; rooms labeled and matching grid; outbuildings/garages with dimensions."
    cross_check: "sketch room count == grid room count; all floors present"
    sources: [{doc: appraisal, sketch: [floors, dimensions, rooms], sca_grid: [subject_grid_room_count]}]
    reject_as: ["The floor plan sketch is missing floors/dimensions or its room count does not match the sales grid. Please revise."]

  - id: "129"
    item: "Area Calculations"
    rule_id: ~
    check_type: cross_modal
    llm_role: read_fact
    requirement: "Provided (usually at the bottom of the sketch page)."
    sources: [{doc: appraisal, sketch: [area_calculations]}]
    reject_as: ["Area calculations are missing from the sketch page. Please provide."]

  # ──────────────────────────────────── MAPS ─────────────────────────────────
  - id: "130"
    item: "Aerial Map"
    rule_id: ~
    check_type: cross_modal
    llm_role: read_fact
    requirement: "Aerial map must be provided."
    sources: [{doc: appraisal, maps: [aerial]}]
    reject_as: ["Please provide an Aerial Map in the report."]

  - id: "131"
    item: "Location Map"
    rule_id: ~
    check_type: cross_modal
    llm_role: read_fact
    requirement: "Shows subject and all comparables with enough detail to identify relative locations."
    cross_check: "location map pins == subject + all grid comps"
    sources: [{doc: appraisal, maps: [location], sca_grid: [comp_N_address]}]
    reject_as: ["The location map does not show the subject and all comparables. Please provide/revise."]

  - id: "132"
    item: "Plat Map"
    rule_id: ~
    check_type: cross_modal
    llm_role: read_fact
    requirement: "Required if site dimensions cannot be provided on page 1."
    sources: [{doc: appraisal, maps: [plat], fields: [site_dimensions]}]
    reject_as: ["Site dimensions are not on page 1; a Plat Map is required. Please provide."]

  - id: "133"
    item: "Flood Map"
    rule_id: ST-8
    also: [~]
    check_type: cross_modal
    llm_role: read_fact
    requirement: "Required if the subject is in a flood zone."
    cross_check: "flood_zone==Yes → flood map present"
    sources: [{doc: appraisal, maps: [flood], fields: [flood_zone]}]
    reject_as: ["The subject is in a flood zone; a Flood Map is required. Please provide."]

  # ──────────────────── ADDITIONAL PAGES / DATA REQUIRED ─────────────────────
  - id: "134"
    item: "Appraiser's License"
    rule_id: DOC-1
    check_type: cross_document
    llm_role: none
    requirement: "License copy included; info matches signature page; not expired at signature date."
    cross_check: "license copy present + matches sig page + not expired at signature_date"
    sources: [{doc: appraisal, fields: [license_copy, license_number, license_expiration, signature_date]}]
    reject_as: ["Please provide an updated copy of your license — the copy provided has expired."]

  - id: "135"
    item: "E & O Insurance"
    rule_id: ~
    check_type: presence
    llm_role: none
    requirement: "Not required for every report; absence is acceptable."
    sources: [{doc: appraisal, fields: [eo_insurance]}]
    reject_as: []

  - id: "136"
    item: "UAD data set"
    rule_id: ~
    check_type: presence
    llm_role: none
    requirement: "UAD-compliant data set present."
    sources: [{doc: appraisal, fields: [uad_dataset]}]
    reject_as: ["The UAD data set is missing or non-compliant. Please provide."]
