# Prometheus scrape config for the UAT compose stack.
# The Java actuator is exposed on the internal management port 9091 (application-uat.yml),
# reachable over the compose network as java-backend:9091 and NOT published to the host.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alert.rules.yml

scrape_configs:
  - job_name: apprisal-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["java-backend:9091"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
