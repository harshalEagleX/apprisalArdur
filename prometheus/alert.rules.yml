# SHAL — Prometheus alert rules (OBS-008)
#
# Watches the metrics Micrometer exposes at /actuator/prometheus:
#   - hikaricp_*            (auto-bound) — DB pool saturation
#   - jvm_*, process_*      (auto-bound) — heap / CPU
#   - http_server_requests (auto-bound) — latency / error rate
#   - shal_batches_*    (QcMetrics)  — QC backlog & stuck batches
#
# Load via prometheus.yml:  rule_files: [ "alert.rules.yml" ]
# Tune thresholds to your host; the comments give the rationale.

groups:
  - name: shal-availability
    rules:
      - alert: SHALBackendDown
        expr: up{job="shal-backend"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "SHAL backend is down"
          description: "Prometheus cannot scrape the backend for >1m."

  - name: shal-db-pool
    rules:
      # Pending threads waiting for a connection = pool exhausted. Sustained >0 means
      # requests are queueing on the DB pool (the review screens will lag).
      - alert: HikariPoolExhausted
        expr: hikaricp_connections_pending > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "DB connection pool saturated"
          description: "{{ $value }} threads have been waiting for a Hikari connection for 5m. Raise DB_POOL_MAX or investigate slow queries."

      - alert: HikariPoolNearMax
        expr: (hikaricp_connections_active / hikaricp_connections_max) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "DB pool >90% utilised"
          description: "Active connections have been above 90% of max for 10m."

  - name: shal-jvm
    rules:
      - alert: JvmHeapHigh
        expr: (sum by (instance) (jvm_memory_used_bytes{area="heap"}) / sum by (instance) (jvm_memory_max_bytes{area="heap"})) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "JVM heap >90%"
          description: "Heap usage has been above 90% for 10m — risk of GC thrash / OOM."

  - name: shal-http
    rules:
      # 5xx rate over total request rate. Fires on a sustained server-error spike.
      - alert: HttpServerErrorSpike
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "HTTP 5xx rate >5%"
          description: "More than 5% of requests have returned 5xx for 5m."

  - name: shal-qc
    rules:
      # Stuck batches the reconciler hasn't cleared. Any sustained value is abnormal.
      - alert: QcBatchesStuck
        expr: shal_batches_qc_stuck > 0
        for: 20m
        labels: { severity: warning }
        annotations:
          summary: "QC batches stuck in processing"
          description: "{{ $value }} batch(es) have been in QC_PROCESSING beyond the reconciler window for 20m. Check the Python OCR service and Celery worker."

      # Review backlog growing — staffing / throughput signal, not an error.
      - alert: ReviewBacklogHigh
        expr: shal_batches_review_pending > 50
        for: 30m
        labels: { severity: info }
        annotations:
          summary: "Reviewer backlog is high"
          description: "{{ $value }} batches have awaited a reviewer for 30m."

      - alert: QcErrorBatchesPresent
        expr: shal_batches_error > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Batches in ERROR state"
          description: "{{ $value }} batch(es) are in ERROR and need investigation."
