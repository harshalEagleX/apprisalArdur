  section: neighborhood
  item: Description
  check_text: Description — Neighborhood description should be fill up
  reject_text: Please provide neighborhood description under Neighborhood section.
  reject_branches:
  - trigger: neighborhood description blank
    reject_text: Please provide neighborhood description under Neighborhood section.
  hold: false
  never_reject: false
