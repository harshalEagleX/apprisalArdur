  reject_branches:
  - trigger: site area blank
    reject_text: Site Area is not mentioned under Site Section, please correct.
  - trigger: site area missing sf/ac unit
    reject_text: Size area should be in 'sf' or 'ac' under Site Section, please revise.
  - trigger: dimensions/shape/view blank
    reject_text: Please check or correct the site ___________ under Site Section.
  hold: false
  never_reject: false
- item_id: EQ-30
  section: site
  item: Zoning Classification, Description and Compliance
  check_text: 'Zoning Classification, Description and Compliance — Zoning Compliance atleast one box should
    be checked. (legal, legal non-conferming and No zoning) | Triggers: If legal checked no comment needed;
    if legal non-conferming or No zoning then add rejection:1. Zoning Compliance is marked on ’No Zoning’,
    please comment if the subject can be rebuilt if destroyed. | Trigger: If illigal is marked Specific
    Zoning Classification and Zoning Description : should be fill up | Trigger: if blank then add rejection'
  reject_text: Please detail the comments on the subject's zoning being legal non conforming and if it
    can be rebuilt if destroyed.
  reject_branches:
  - trigger: zoning legal non-conforming, no comment
    reject_text: Please detail the comments on the subject's zoning being legal non conforming and if
      it can be rebuilt if destroyed.
  - trigger: no zoning, no comment
    reject_text: Please detail the comments on the subject's lack of zoning and if this has any adverse
      affects on the subject's marketability. And, comment if the subject can be rebuilt if destroyed.
  - trigger: zoning classification blank
    reject_text: Please revise zoning description noted under site section.
  hold: false
  never_reject: false
- item_id: EQ-31
