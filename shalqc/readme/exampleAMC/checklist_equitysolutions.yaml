meta:
  amc: EQUITYSOLUTIONS
  source: Appraisal QC Checklist -Detailed.xlsx → Sheet1
  format: native (final_shalqccore.md Annex B §3 Step 0)
  count: 134
items:
- item_id: EQ-A
  section: order
  item: Form Type (Product)
  check_text: Form Type (Product) — Report must be provided same as ordered
  reject_text: Report form type does not match the product ordered on the order form, please correct.
  reject_branches:
  - trigger: form != ordered product
    reject_text: Report form type does not match the product ordered on the order form, please correct.
  hold: false
  never_reject: false
- item_id: EQ-B
  section: order
  item: Transaction type
  check_text: Transaction type — Loan type on order form match with Assignment Type
  reject_text: Assignment Type on appraisal report is "Refinance", however Appraisal Order Detail shows
    as "Purchase", please correct.
  reject_branches:
  - trigger: assignment type != order
    reject_text: Assignment Type on appraisal report is "Refinance", however Appraisal Order Detail shows
      as "Purchase", please correct.
  - trigger: both purchase and refinance boxes marked
    reject_text: Assignment type is checked on both options "Purchase and Refinance". Please correct.
  hold: false
  never_reject: false
- item_id: EQ-C
  section: subject
  item: Property Address, City, State, Zip Code and County
  check_text: 'Property Address, City, State, Zip Code and County — Must match the Client Engagement Letter
    exactly and be verified with USPS, if the USPS verification indicates the address differs from the
    client engagement letter, a comment must be provided. | Triggers: If property address is different
    than order form'
  reject_text: 'Please correct Property Address on the report to match the order: ___________.'
  reject_branches:
  - trigger: property address mismatch vs order
    reject_text: 'Please correct Property Address on the report to match the order: ___________.'
  - trigger: city/county mismatch vs order
    reject_text: 'Please correct City/County name to match the order: ___________.'
  - trigger: zip mismatch (first 5) vs order
    reject_text: 'Please correct property Zip code on the report to match the order: ___________.'
  hold: false
  never_reject: false
- item_id: EQ-D
  section: subject
  item: Borrower
  check_text: 'Borrower — Must match Client Engagement letter exactly, watch commonly missed co‐borrower
    and spelling errors. Does not need to match Owner of Public Record. If transaction type is Refinance
    and the Owner of Record and the borrower do not match, a comment must be provided. | Triggers: If
    report missed Co-borrower name.'
  reject_text: 'Please correct borrower name to match order: ___________.'
  reject_branches:
  - trigger: borrower name mismatch vs order
    reject_text: 'Please correct borrower name to match order: ___________.'
  - trigger: borrower name spelling
    reject_text: Please correct spelling of borrower's first/last name, it should be ___________.
  - trigger: co-borrower on order, missing on report
    reject_text: Please add co-borrower name as ___________.
  - trigger: refi, owner != borrower, no comment
    reject_text: Please verify Borrower name and Owner of Public Record as the report indicates they are
      different and this is a Refi/Equity transaction.
  hold: false
  never_reject: false
- item_id: EQ-1
  section: subject
  item: Owner of Public record
  check_text: 'Owner of Public record — Provided by the appraiser and be current. Owner of Public record
    does not have to match the borrower. If the transaction type is Refinance and the Owner of Record
    and the borrower do not match, a comment must be provided. | Triggers: IF Owner of Public record does
    not match the borrower'
  reject_text: Assignment type of the report is noted as 'Refinance'; however, the owner name and the
    borrower name are different, please revise or comment.
  reject_branches:
  - trigger: refi, owner != borrower
    reject_text: Assignment type of the report is noted as 'Refinance'; however, the owner name and the
      borrower name are different, please revise or comment.
  - trigger: purchase, owner == borrower
    reject_text: Assignment Type is "Purchase", however borrower and owner of public record names are
      same, please correct.
  hold: false
  never_reject: false
- item_id: EQ-2
  section: subject
  item: Legal Description
  check_text: Legal Description — This field should not be blank
  reject_text: Please provide legal description under subject section.
  reject_branches:
  - trigger: legal description blank
    reject_text: Please provide legal description under subject section.
  hold: false
  never_reject: false
- item_id: EQ-3
  section: subject
  item: 'Assessor''s parcel #'
  check_text: 'Assessor''s parcel # — This field should not be blank'
  reject_text: 'Please provide Assessor''s Parcel # under subject section.'
  reject_branches:
  - trigger: 'assessor parcel # blank'
    reject_text: 'Please provide Assessor''s Parcel # under subject section.'
  hold: false
  never_reject: false
- item_id: EQ-4
  section: subject
  item: Tax Year
  check_text: Tax Year — Must be latest or last 2 year (This field should not be blank)
  reject_text: Please revise Tax year, it should be current or previous years with respect to the effective
    date of appraisal report.
  reject_branches:
  - trigger: tax year stale or blank
    reject_text: Please revise Tax year, it should be current or previous years with respect to the effective
      date of appraisal report.
  hold: false
  never_reject: false
- item_id: EQ-5
  section: subject
  item: R.E. Taxes $
  check_text: R.E. Taxes $ — Not allow in decimals (This field should not be blank)
  reject_text: Please provide the Real Estate Taxes under subject section.
  reject_branches:
  - trigger: R.E. taxes blank
    reject_text: Please provide the Real Estate Taxes under subject section.
  - trigger: R.E. taxes in decimals
    reject_text: '''R.E. Taxes $'' should not be in decimals under Subject Section, please revise.'
  hold: false
  never_reject: false
- item_id: EQ-6
  section: subject
  item: Neighborhood Name
  check_text: 'Neighborhood Name — The subdivision name must be provided or if none, use the most common
    name for the area. Cannot be blank or state None, N/A or Unknown. | Triggers: If Neighborhood name
    mentioned none or n/a'
  reject_text: The neighborhood name in subject section is mentioned as N/A. per the UAD requirements;
    the appraiser should enter a neighborhood name. It may be a name recognized by the municipality in
    which the property is sited, such as a subdivision name. If there is no neighborhood name recognized
    by the municipality, enter the common name by which residents refer to the location. Please revise.
  reject_branches:
  - trigger: neighborhood name N/A / None / Unknown
    reject_text: The neighborhood name in subject section is mentioned as N/A. per the UAD requirements;
      the appraiser should enter a neighborhood name. It may be a name recognized by the municipality
      in which the property is sited, such as a subdivision name. If there is no neighborhood name recognized
      by the municipality, enter the common name by which residents refer to the location. Please revise.
  - trigger: neighborhood name blank
    reject_text: Please provide Neighborhood Name under subject section.
  hold: false
  never_reject: false
- item_id: EQ-7
  section: subject
  item: Map Reference
  check_text: 'Map Reference — Provided by the appraiser and must be current | Triggers: IF Map Reference
    missing or blank'
  reject_text: Please provide Map Reference under subject section.
  reject_branches:
  - trigger: map reference blank
    reject_text: Please provide Map Reference under subject section.
  hold: false
  never_reject: false
- item_id: EQ-8
  section: subject
  item: Census Tract
  check_text: 'Census Tract — Four digit then 2 Digit after decimal | Triggers: IF Census Tract missing
    or blank'
  reject_text: Please provide Census tract under subject section.
  reject_branches:
  - trigger: census tract blank or malformed
    reject_text: Please provide Census tract under subject section.
  hold: false
  never_reject: false
- item_id: EQ-9
  section: subject
  item: Occupant
  check_text: 'Occupant — If tenant: should verify lease dates and amount. If vacant: must state if utilities
    are on. | Triggers: If occupancy is owner occupied photos should check photos.; If occupancy is vacant
    and photo shows occupied: Reject as: In subject section, occupancy is marked as vacant however as
    per photos subject property appears to be occupied, please revise or comment if it is a staged home.'
  reject_text: In subject section, occupancy is marked as vacant however as per photos subject property
    appears to be occupied, please revise or comment if it is a staged home.
  reject_branches:
  - trigger: marked vacant, photos show occupied
    reject_text: In subject section, occupancy is marked as vacant however as per photos subject property
      appears to be occupied, please revise or comment if it is a staged home.
  - trigger: marked owner-occupied, photos show vacant
    reject_text: The subject section indicates that the property is owner occupied however the photos
      appear to show the property is currently vacant. Please revise or comment.
  hold: false
  never_reject: false
- item_id: EQ-10
  section: subject
  item: Special Assessments
  check_text: 'Special Assessments — Must comment if there are Special Assessments provided, how much
    and what they are for. If no special assessment it must contain "0". | Triggers: If special assessment
    mentioned'
  reject_text: Please provide detail commentary of special assessments $___ used for.
  reject_branches:
  - trigger: special assessment amount > 0, no commentary
    reject_text: Please provide detail commentary of special assessments $___ used for.
  - trigger: special assessment field != commentary
    reject_text: Special assessment under subject section shows ___ however comment on page ___ shows
      ___, please correct.
  hold: false
  never_reject: false
- item_id: EQ-11
  section: subject
  item: PUD and HOA
  check_text: 'PUD and HOA — Per FNMA if HOA dues are mandatory, it''s a PUD, proper information should
    filled out in PUD section. Make sure per year or per month is marked. | Triggers: If HOA is given
    and PUD is not marked Verify with Client Engagement letter if Refinance or Purchase. If "Other" is
    marked, the transaction type must be filled in, in the space provided.'
  reject_text: HOA dues are noted as "$___" per ___ in the subject section however PUD box is not marked,
    please revise.
  reject_branches:
  - trigger: HOA dues present, PUD box unmarked
    reject_text: HOA dues are noted as "$___" per ___ in the subject section however PUD box is not marked,
      please revise.
  - trigger: PUD marked, per year/per month unmarked
    reject_text: PUD box is check marked however per year and per month are not check marked, please correct.
  - trigger: PUD marked, HOA $0 with per month
    reject_text: In the subject section PUD box is marked however HOA amount noted as $0 with per month.
      Please verify.
  hold: false
  never_reject: false
- item_id: EQ-E
  section: subject
  item: Lender/Client Name
  check_text: 'Lender/Client Name — This must match lender/client name listed on the Client Engagement
    Letter (Client Displayed on Report) | Triggers: If lender/client name is different than order form'
  reject_text: 'Please correct Lender/Client on the report to match the order: ___________.'
  reject_branches:
  - trigger: lender/client name mismatch vs order
    reject_text: 'Please correct Lender/Client on the report to match the order: ___________.'
  hold: false
  never_reject: false
- item_id: EQ-F
  section: subject
  item: Lender/client Address
  check_text: 'Lender/client Address — Must match lender/client address listed on the Client Engagement
    Letter | Triggers: If lender/client address is different than order form'
  reject_text: 'Please correct Lender/Client Address on the report to match the order: ___________.'
  reject_branches:
  - trigger: lender/client address mismatch vs order
    reject_text: 'Please correct Lender/Client Address on the report to match the order: ___________.'
  hold: false
  never_reject: false
- item_id: EQ-12
  section: subject
  item: Property Rights Appraised
  check_text: Property Rights Appraised — Only one checkbox mark is allow
  reject_text: Only one checkbox should be marked under Property Rights Appraised, please correct.
  reject_branches:
  - trigger: more than one Property Rights box marked
    reject_text: Only one checkbox should be marked under Property Rights Appraised, please correct.
  hold: false
  never_reject: false
- item_id: EQ-13
  section: subject
  item: Subject Listed/Sold within 12 Months
  check_text: 'Subject Listed/Sold within 12 Months If there are no prior listings or current sale, this
    should be marked no and the appraiser MUST include the data source. Must state the MLS abreviated
    name for the area. IE. MXLMLS | Trigger: If there are no prior listings or current sale No should
    be mark and include data source. If the subject IS listed or has a current sale, the field must be
    in this format: DOM #; Abbreviated MLS name and MLS #. Current list/sale price, current list/sale
    date. (THIS MUST BE ON PAGE 1) Any additional data can be included in the report addendum. If the
    subject has been listed but NOT a purchase, a comment must be provided if the opinion of market value
    varies by the most recent listing price by more than 3% | Trigger: If currently listed marked as Yes'
  reject_text: Please provide Data sources in subject section for the question "Is the subject property
    currently offered for sale or has it been offered for sale in the twelve months prior to the effective
    date of this appraisal?" as per UAD requirement.
  reject_branches:
  - trigger: offered-for-sale = No, data source missing
    reject_text: Please provide Data sources in subject section for the question "Is the subject property
      currently offered for sale or has it been offered for sale in the twelve months prior to the effective
      date of this appraisal?" as per UAD requirement.
  - trigger: offered-for-sale = Yes, listing history incomplete (DOM/MLS# missing)
    reject_text: 'Please provide the complete listing history of the subject in the Subject section. Currently
      it reads just the Listing date and listing price. The DOM & MLS # is also required, please include
      & resend.'
  - trigger: offered-for-sale = Yes, data source/price/date missing
    reject_text: Please include Data Source, listing price, and listing date for the subject's 12 month
      listing history in the Subject section.
  hold: false
  never_reject: false
- item_id: EQ-14
  section: contract
  item: Did & Did Not box
  check_text: 'Did & Did Not box — I did did not analyze the contract for sale for the subject purchase
    transaction. Explain the results of the analysis of the contract for sale or why the analysis was
    not performed. | Triggers: If Assignment Type is for Re-finance then contract section must be blank.'
  reject_text: The assignment is meant for a refinance transaction; Per the UAD requirements, the contract
    section should be left blank.
  reject_branches:
  - trigger: refinance, contract section filled
    reject_text: The assignment is meant for a refinance transaction; Per the UAD requirements, the contract
      section should be left blank.
  - trigger: refinance, contract checkmarks present
    reject_text: Please remove check marks from contract section.
  - trigger: purchase, contract section blank
    reject_text: The assignment is meant for a Purchase transaction; the contract section should be filled.
  hold: false
  never_reject: false
- item_id: EQ-15
  section: contract
  item: Contract Price & Date of Contract
  check_text: 'Contract Price & Date of Contract — check contract date and contract price from Purchase
    agreement. | Triggers: if contract price or contract date is different'
  reject_text: Price of contract does not match with the Price in the actual contract copy, please correct.
  reject_branches:
  - trigger: contract price != contract copy
    reject_text: Price of contract does not match with the Price in the actual contract copy, please correct.
  - trigger: contract date != contract copy
    reject_text: Date of contract does not match with the date in the contract copy, please correct.
  - trigger: contract price != order details
    reject_text: Price of contract does not match with the Appraisal order details, please correct.
  hold: false
  never_reject: false
- item_id: EQ-17
  section: contract
  item: Data Source(s)
  check_text: 'Data Source(s) — Data source is compulsory | Triggers: Is the property seller the owner
    of public record? if checkbox marked for yes and data source is missing'
  reject_text: Please provide data source for "Is the property seller the owner of public record?" under
    contract section.
  reject_branches:
  - trigger: seller = owner, data source blank
    reject_text: Please provide data source for "Is the property seller the owner of public record?" under
      contract section.
  hold: false
  never_reject: false
- item_id: EQ-18
  section: contract
  item: Is there any financial assistance (loan charges, sale concessions, gift or downpayment assistance,
    etc.) to be paid by any party on behalf of the borrower?
  check_text: 'Is there any financial assistance (loan charges, sale concessions, gift or downpayment
    assistance, etc.) to be paid by any party on behalf of the borrower? — Is there any financial assistance
    (loan charges, sale concessions, gift or downpayment assistance, etc.) to be paid by any party on
    behalf of the borrower? check yes or no checkbox. | Triggers: If Yes, report the total dollar amount
    and describe the items to be paid. ( check from Purchase Agreement); If no, then report the total
    dollar amount and describe the items to be paid shoule apply "0" check from Purchase agreement. |
    Trigger: if concession is given but different from purchase agreement'
  reject_text: Is there any financial assistance (loan charges, sale concessions, gift or downpayment
    assistance, etc.) to be paid by any party on behalf of the borrower? marked as No under contract section
    however concession is provided, please verify.
  reject_branches:
  - trigger: financial assistance = No, concession exists
    reject_text: Is there any financial assistance (loan charges, sale concessions, gift or downpayment
      assistance, etc.) to be paid by any party on behalf of the borrower? marked as No under contract
      section however concession is provided, please verify.
  - trigger: concession $0 on report vs contract shows a concession
    reject_text: In the contract section Seller concession noted $0 however Purchase Contract shows Seller
      concession $___. Please verify.
  - trigger: financial assistance = Yes, amount/items not described
    reject_text: Financial assistance is marked Yes however total dollar amount / items to be paid are
      not described, please provide.
  hold: false
  never_reject: false
- item_id: EQ-19
  section: neighborhood
  item: Characteristcis & Housing Trends
  check_text: 'Characteristcis & Housing Trends — Neighborhood Characteristics and One-Unit Housing Trends
    At least 1 box should be checked | Triggers: if checkbox is missing : reject as In the neighborhood
    section checbox is missing for _____, please revise.'
  reject_text: In the neighborhood section checkbox is missing for ___________, please revise.
  reject_branches:
  - trigger: a Characteristics/Trends checkbox missing
    reject_text: In the neighborhood section checkbox is missing for ___________, please revise.
  hold: false
  never_reject: false
- item_id: EQ-21
  section: neighborhood
  item: Unit Housing Price and Age
  check_text: Unit Housing Price and Age — Appraiser to provide and be aware of the high and low prices
    given. The unadjusted sales prices of the comparables used in the report must fall within the ranges
    unless comps are not located within the neighborhood (comment required). Comment required if the Market
    value differs from Predominant by more than 10%, over or under improved and does it affect marketability?
    Trend should match MC form or specific commentary is required.
  reject_text: Please comment on the final value exceeding the Neighborhood predominant value by 10%.
  reject_branches:
  - trigger: final value > predominant + 10%, no comment
    reject_text: Please comment on the final value exceeding the Neighborhood predominant value by 10%.
  - trigger: final value < predominant - 10%, no comment
    reject_text: Please comment on the final value is less than the Neighborhood predominant value by
      10%.
  - trigger: predominant value / age missing
    reject_text: Predominant value and Predominant Age are missing, please correct.
  - trigger: comps fall outside stated One-Unit Housing range
    reject_text: In the Neighborhood section please revise the low, high, pred. price range in One-Unit
      Housing section on page 1.
  hold: false
  never_reject: false
- item_id: EQ-22
  section: neighborhood
  item: Present Land Use
  check_text: Present Land Use — One-Unit Housing and Present Land Use %
  reject_text: Total of present land use % shows ___ instead of 100, please correct.
  reject_branches:
  - trigger: present land use % total != 100
    reject_text: Total of present land use % shows ___ instead of 100, please correct.
  - trigger: Other land use > 0, no comment
    reject_text: Please comment on ___% other land usage.
  - trigger: Other land use % != commentary %
    reject_text: Land use for "Other" land shows "___%", yet your commentary indicates a different percentage
      "___%". Correct for consistency.
  hold: false
  never_reject: false
- item_id: EQ-23
  section: neighborhood
  item: Boundaries
  check_text: 'Boundaries — Neighborhood Boundaries : all boundaries should be described | Triggers: If
    missing : reject as ____ boundary is missing under Neighborhood Boundries , please revise.'
  reject_text: ___________ boundary is missing under Neighborhood Boundaries, please revise.
  reject_branches:
  - trigger: one boundary missing
    reject_text: ___________ boundary is missing under Neighborhood Boundaries, please revise.
  - trigger: boundaries not N/S/E/W delineated
    reject_text: The Neighborhood Boundaries must be clearly delineated using 'North', 'South', 'East'
