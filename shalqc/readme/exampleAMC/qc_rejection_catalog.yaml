  item: Interior photos
  check_type: cross_modal
  requirement: Interior photos — Photos of all rooms (Kitchen, living room, dining
    room, family room, bedrooms and all baths) are required for all interior inspection
    reports. Photos of any deferred maintenance must be provided. Photos must be labeled
    with the specific room name.
