- id: '126'
  rule_id: EXH-3
  item: Additional Subject photos
  check_type: cross_modal
  requirement: Additional Subject photos — Photos of all outbuildings and special
    features (pools, etc.) are required. All outbuildings must have interior photos
    as well as photos of any deferred maintenance for the subject. Photos of any exterior
    obsolescence should be provided. Photos containing people or interior personal
    pictures should be avoided if possible.
  reject_as: []
