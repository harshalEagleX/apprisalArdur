    type is Refinance and the Owner of Record and the borrower do not match, a comment
    must be provided. | Triggers: IF Owner of Public record does not match the borrower'
  reject_as:
  - Assignment type of the report is noted as ‘Refinance’; however, the owner name
    and the borrower name are different, please revise or comment.
  sources:
  - doc: appraisal
    fields:
    - owner_of_public_record
