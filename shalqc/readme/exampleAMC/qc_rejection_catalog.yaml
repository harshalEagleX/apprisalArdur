  check_type: cross_document
  requirement: 'Borrower — Must match Client Engagement letter exactly, watch commonly
    missed co‐borrower and spelling errors. Does not need to match Owner of Public
    Record. If transaction type is Refinance and the Owner of Record and the borrower
    do not match, a comment must be provided. | Triggers: If report missed Co-borrower
    name.'
