# UAD 2.6 form-applicability registry (L2 layer, version-namespaced).
#
# BBOX_PROVENANCE_REGISTRY_PLAN.md Phase 1. Keyed by (uad_version, form_type,
# field_id) — this file is the `uad26` slice. Its job here: FORM-AWARE N/A. A
# check whose bound labels are ALL absent on the detected form auto-N/As — the
# REGISTRY (not the LLM) decides applicability, so one AMC ruleset runs across
# whatever form arrives (architecture note §2 rule 2).
#
# SAFETY CONTRACT (this gate can wrongly N/A a valid check, which is a correctness
# bug — worse than a false REVIEW — so the seed is deliberately tiny):
#   * List a field under `absent_fields` ONLY when it is UNAMBIGUOUSLY not on that
#     form. When unsure, leave it out — absence here means "unknown", never
#     "exists". A 1-unit detached URAR (1004) legitimately CAN be a PUD with an
#     HOA, so hoa_*/project_name are NOT listed (they can appear on a 1004).
#   * Grow this per golden-set failure, never speculatively.
version: "uad26-forms-0.1.0"

forms:
  "1004":
    label: "URAR — 1-unit detached"
    # a single detached dwelling has no condo/co-op unit identifier
    absent_fields:
      - unit_number
  "1073":
    label: "Individual Condominium Unit Appraisal Report"
    # The 1073 sales-comparison grid has NO Site/Lot line (its lines are Floor
    # Location, Common Elements, Rec Facilities, HOA fees, …) — a condo unit owns no
    # site. So the per-comp site-size cell does not exist on this form; EQ-63
    # ("site size in SF/acres") was a false REVIEW on every 1073 (golden-set: the
    # 691 Auwaha condo). UNAMBIGUOUS per the form; grown from a real failure.
    absent_fields:
      - comp_N_site_size
      # The 1073 has NO cost approach and NO opinion-of-site-value line — Fannie Mae
      # does not require cost/income for an individual condo unit (the unit owns no
      # site). EQ-92 ("support for the opinion of site value") was a false REVIEW on
      # every 1073 (golden-set: the ESCA-0020171 condo, site_value_estimate absent).
      - site_value_estimate
      # A condo unit report has no foundation/basement section — foundation and the
      # building substructure are common elements, not on the 1073 improvements grid.
      # EQ-44 ("Foundation") false-REVIEWed on the same condo (all five labels absent).
      - foundation_type
      - has_full_basement
      - has_partial_basement
      - basement_gla
      - basement_finish_pct
