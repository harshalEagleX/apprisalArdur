- item_id: EQ-13
  check_text: 'Subject Listed/Sold within 12 Months If there are no prior listings
    or current sale, this should be marked no and the appraiser MUST include the data
    source. Must state the MLS abreviated name for the area. IE. MXLMLS | Trigger:
    If there are no prior listings or current sale No should be mark and include data
    source. If the subject IS listed or has a current sale, the field must be in this
    format: DOM #; Abbreviated MLS name and MLS #. Current list/sale price, current
    list/sale date. (THIS MUST BE ON PAGE 1) Any additional data can be included in
    the report addendum. If the subject has been listed but NOT a purchase, a comment
    must be provided if the opinion of market value varies by the most recent listing
    price by more than 3% | Trigger: If currently listed marked as Yes'
  reject_text: Please provide Data sources in subject section for the question “Is
    the subject property currently offered for sale or has it been offered for sale
    in the twelve months prior to the effective date of this appraisal?” as per UAD
    requirement.
  section: subject
  item_name: Subject Listed/Sold within 12 Months
  bound_labels:
  - data_source
  - days_on_market
  - list_price
  - list_date
  - mls_number
  scope: cross_section
  expects: if offerred_for_sale_12mo == false then data_source present; if true then
    days_on_market, list_price, list_date, mls_number present
  judgeable: text
  conditional:
    condition_labels:
    - mca_median_sale_list_ratio_prior_7_12
    - prior_sale_data_source_subject
    - prior_sale_date_subject
    - prior_sale_effective_date_subject
    consequence_labels:
