items:
- item_id: EQ-6
  check_text: 'Neighborhood Name — The subdivision name must be provided or if none,
    use the most common name for the area. Cannot be blank or state None, N/A or Unknown.
    | Triggers: If Neighborhood name mentioned none or n/a'
  reject_text: The neighborhood name in subject section is mentioned as N/A. per the
    UAD requirements; the appraiser should enter a neighborhood name. It may be a
    name recognized by the municipality in which the property is sited, such as a
    subdivision name. If there is no neighborhood name recognized by the municipality,
    enter the common name by which residents refer to the location. Please revise.
  section: subject
  item_name: Neighborhood Name
  bound_labels:
  - neighborhood_name
  scope: cross_section
  expects: neighborhood_name not blank and not one of ['None','N/A','Unknown']
  judgeable: text
  conditional:
    condition_labels:
    - neighborhood_name
    - appraiser_company_name
    - appraiser_name
    - borrower_name
    consequence_labels:
    - did_analyze_contract
    - is_pud_checked
    - neighborhood_name
    - occupant_status
  bound_by: llm
  binder_confidence: 0.6
- item_id: EQ-8
