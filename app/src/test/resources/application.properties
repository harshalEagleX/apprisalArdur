# Test-scope configuration.
#
# WHY THIS FILE EXISTS
# application.yml declares `ocr.service.api-key: ${INTERNAL_API_KEY}` with NO
# default, on purpose — a missing or stale shared key must fail fast at startup
# rather than surface as 401s between Java and Python later. OcrServiceConfig
# enforces the same thing again in @PostConstruct, and ProductionReadinessValidator
# reports it under strict posture.
#
# That guard is correct for RUNNING the app and must not be softened. But it also
# meant the Spring context could not start for TESTS on any machine without a
# project-root .env — including CI, which has no secrets. Every @SpringBootTest
# then failed with:
#
#   PlaceholderResolutionException: Could not resolve placeholder 'INTERNAL_API_KEY'
#
# 63 errors on a clean checkout, and the reason never appeared in the CI summary
# (just "exit code 1"), which is why this went unexplained across several runs.
#
# Setting the resolved property directly here satisfies the placeholder for tests
# only. Test resources take precedence over main's application.yml, so production
# still reads INTERNAL_API_KEY from the environment and still fails fast without it.
ocr.service.api-key=test-internal-api-key

# Never let a test run reach a real Python service, whatever a developer has
# running locally — tests stub PythonClientService.
ocr.service.url=http://127.0.0.1:1
