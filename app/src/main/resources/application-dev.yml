# ── Dev profile ─────────────────────────────────────────────────────────────────
# Dev uses the same DB_URL/DB_USERNAME/DB_PASSWORD from the project root .env as
# the default profile. Keep Java and Python on one shared local database so QC
# jobs, batches, processing lifecycle rows, and OCR caches do not split across
# local and remote databases.
#
# How to activate (pick one):
#   IntelliJ IDEA  →  Run/Debug Configuration → "Active profiles": dev
#   Maven          →  mvn spring-boot:run -Dspring-boot.run.profiles=dev
#   Environment    →  export SPRING_PROFILES_ACTIVE=dev
#
spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      # Dev follows the same no-Flyway rule: Hibernate updates Java-owned tables.
      ddl-auto: create
    show-sql: false

logging:
  level:
    com.shal: DEBUG
