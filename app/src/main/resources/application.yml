spring:
  config:
    import:
      # Load .env from the CWD (works when running from project root or via JAR)
      - optional:file:.env[.properties]
      # Fallback for IDE / Maven runs where CWD is the app/ module directory
      - optional:file:../.env[.properties]

  jackson:
    time-zone: Asia/Kolkata

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ardurApprisal}
    username: ${DB_USERNAME:harshalsmac}
    password: ${DB_PASSWORD:12345678}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Scaling Phase 3 §4.1: sized for 50 concurrent users. Connection arithmetic —
      # Java 30 + (7 Celery workers × 5) ≈ 65 < Postgres max_connections; raise
      # max_connections / add PgBouncer before growing further. Configurable (P-4).
      maximum-pool-size: ${DB_POOL_MAX:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: 30000
      idle-timeout: 600000
      keepalive-time: 300000
      max-lifetime: 1800000
      connection-init-sql: SET TIME ZONE 'Asia/Kolkata'

  jpa:
    hibernate:
      # Java schema is managed directly by JPA/Hibernate. Do not wire Flyway,
      # Liquibase, or other third-party migration runners in this project.
      # Manual DB fixes stay manual; Python tables are reconciled separately
      # through ocr-service/manage_db.py update. Use update here because the
      # shared database is persistent across restarts, not disposable.
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Kolkata
          # Without batching, the post-Python save inserts ~138 QCRuleResult rows
          # plus their Envers audit rows one-by-one — ~50-60s on the live system.
          # batch_size collapses those into multiplexed multi-row INSERTs.
          batch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: false
    show-sql: false
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      # The uploaded multipart IS the batch ZIP, which holds several appraisal files of
      # 5–50 MB each — so the envelope must be generous. The real guard is per-FILE: each
      # extracted document is capped at MAX_UPLOAD_PER_FILE_MB (default 50 MB) and must be a
      # PDF, enforced in BatchService on extraction.
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:256MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:256MB}

server:
  tomcat:
    basedir: ${TOMCAT_BASEDIR:/private/tmp/apprisal-tomcat}

  session:
    cookie:
      http-only: true
      secure: ${COOKIE_SECURE:false}
      same-site: strict

app:
  admin:
    username: ${ADMIN_EMAIL:dhoteharshal16@gmail.com}
    password: ${ADMIN_PASSWORD:Admin123!}

  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

  storage:
    path: ${STORAGE_PATH:./uploads}

# IMPORTANT: Use 127.0.0.1, not "localhost".
# On macOS/Linux "localhost" often resolves to ::1 (IPv6) while uvicorn
# listens only on 127.0.0.1 (IPv4) → silent connection failure with zero Python logs.
# Start Python with: uvicorn main:app --host 0.0.0.0 --port 5001 --reload
ocr:
  service:
    url: ${OCR_SERVICE_URL:http://127.0.0.1:5001}
    timeout-seconds: ${OCR_TIMEOUT:900}
    retry-attempts: ${OCR_RETRIES:2}
    # Required shared key loaded from the project root .env.
    # No fallback: missing or stale config must fail fast instead of causing 401s later.
    api-key: ${INTERNAL_API_KEY}

qc:
  enabled: true
  auto-process-on-upload: false
  executor:
    # Scaling Phase 2 (readme/SCALABILITY_PLAN.md §4.1): with Celery doing the heavy
    # OCR off-process, this pool only enqueues + polls (I/O-bound) and fires async
    # event saves — so it can exceed the old memory-bound cap of 2. Tune per host (P-4).
    core-pool-size: ${QC_EXECUTOR_CORE:4}
    max-pool-size: ${QC_EXECUTOR_MAX:8}
    queue-capacity: ${QC_EXECUTOR_QUEUE:200}
  reconciler:
    enabled: ${QC_RECONCILER_ENABLED:true}
    retry-after-minutes: ${QC_RECONCILER_RETRY_MINUTES:15}
    abandon-after-minutes: ${QC_RECONCILER_ABANDON_MINUTES:90}

management:
  endpoints:
    web:
      exposure:
        # Scaling Phase 0 (readme/SCALABILITY_PLAN.md): expose metrics + prometheus so
        # Hikari pool usage, JVM, and HTTP latency are observable for the load-test gates.
        # micrometer-registry-prometheus is already on the classpath (app/pom.xml).
        # SECURITY: /actuator must NOT be public in production — secure it in SecurityConfig
        # or bind a separate management port. Phase 6 wires Grafana/alerts on top of this.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: apprisal
  # Hikari, JVM, and HTTP server timings are auto-bound by Micrometer when actuator
  # is present — no extra code needed; they appear under /actuator/metrics.

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,Asia/Kolkata} %-5level ${PID:- } --- [%thread] %logger{40} : %msg%n"
  level:
    com.apprisal: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
