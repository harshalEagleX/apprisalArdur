spring:
  config:
    import:
      # Load .env from the CWD (works when running from project root or via JAR)
      - optional:file:.env[.properties]
      # Fallback for IDE / Maven runs where CWD is the app/ module directory
      - optional:file:../.env[.properties]

  jackson:
    time-zone: Asia/Kolkata

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shal}
    username: ${DB_USERNAME:harshalsmac}
    password: ${DB_PASSWORD:12345678}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Scaling Phase 3 §4.1: sized for 50 concurrent users. Connection arithmetic —
      # Java 30 + (7 Celery workers × 5) ≈ 65 < Postgres max_connections; raise
      # max_connections / add PgBouncer before growing further. Configurable (P-4).
      maximum-pool-size: ${DB_POOL_MAX:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: 30000
      idle-timeout: 600000
      keepalive-time: 300000
      max-lifetime: 1800000
      connection-init-sql: SET TIME ZONE 'Asia/Kolkata'

  jpa:
    hibernate:
      # Java schema is managed directly by JPA/Hibernate. Do not wire Flyway,
      # Liquibase, or other third-party migration runners in this project.
      # Manual DB fixes stay manual; Python tables are reconciled separately
      # through ocr-service/manage_db.py update.
      #
      # Env-driven so production can run `validate` (Hibernate verifies the live
      # schema matches the entities and refuses to silently auto-mutate it) once a
      # reviewed DDL snapshot is applied, while dev keeps `update`. Default stays
      # `update` so existing startup is unchanged. NEVER set create/create-drop on
      # a shared DB — those drop every table on boot.
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Kolkata
          # Without batching, the post-Python save inserts ~138 QCRuleResult rows
          # plus their Envers audit rows one-by-one — ~50-60s on the live system.
          # batch_size collapses those into multiplexed multi-row INSERTs.
          batch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: false
        # PERF (latency): batch-fetch lazy associations N-at-a-time instead of one
        # SELECT per parent row. Collapses the N+1 the batch-list and reviewer
        # screens would hit walking batch→files→results. Additive — changes query
        # SHAPE only, never results.
        default_batch_fetch_size: 100
        # PERF: pad IN(...) clauses to power-of-two sizes so Postgres reuses one
        # prepared-statement plan across varying id-list lengths (less plan churn).
        query:
          in_clause_parameter_padding: true
    show-sql: false
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      # The uploaded multipart IS the batch ZIP, which holds several appraisal files of
      # 5–50 MB each — so the envelope must be generous. The real guard is per-FILE: each
      # extracted document is capped at MAX_UPLOAD_PER_FILE_MB (default 50 MB) and must be a
      # PDF, enforced in BatchService on extraction.
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:256MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:256MB}

server:
  # PERF (latency/bandwidth): gzip JSON/text responses. The reviewer screens and
  # batch lists return large JSON (rule results, evidence) — compression cuts
  # transfer time materially over the network. Only compresses >1 KB responses.
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/plain,text/css,text/html,application/javascript
    min-response-size: 1024
  http2:
    enabled: ${HTTP2_ENABLED:true}
  tomcat:
    # Portable default: /tmp exists+writable on Linux AND macOS (where it
    # symlinks to /private/tmp). The old /private/tmp default was macOS-only
    # and failed to start Tomcat on Ubuntu. Override with TOMCAT_BASEDIR.
    basedir: ${TOMCAT_BASEDIR:/tmp/shal-tomcat}
    # PERF (load): size the request worker pool for the target concurrency. Defaults
    # (200 threads) are fine, but make them env-tunable so a bigger host can serve
    # more concurrent reviewers/admins without code changes (P-4). accept-count is
    # the OS backlog when all threads are busy — prevents connection refusals under
    # a burst rather than dropping them.
    threads:
      max: ${TOMCAT_THREADS_MAX:200}
      min-spare: ${TOMCAT_THREADS_MIN:25}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:10000}

  session:
    cookie:
      http-only: true
      secure: ${COOKIE_SECURE:false}
      same-site: strict

app:
  admin:
    username: ${ADMIN_EMAIL:harshal@eaglexinfo.com}
    password: ${ADMIN_PASSWORD:Admin123!}

  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

  storage:
    path: ${STORAGE_PATH:./uploads}

# IMPORTANT: Use 127.0.0.1, not "localhost".
# On macOS/Linux "localhost" often resolves to ::1 (IPv6) while uvicorn
# listens only on 127.0.0.1 (IPv4) → silent connection failure with zero Python logs.
# Start Python with: uvicorn main:app --host 0.0.0.0 --port 5001 --reload
ocr:
  service:
    url: ${OCR_SERVICE_URL:http://127.0.0.1:5001}
    timeout-seconds: ${OCR_TIMEOUT:900}
    retry-attempts: ${OCR_RETRIES:2}
    # Required shared key loaded from the project root .env.
    # No fallback: missing or stale config must fail fast instead of causing 401s later.
    api-key: ${INTERNAL_API_KEY}

qc:
  enabled: true
  auto-process-on-upload: false
  executor:
    # Scaling Phase 2 (readme/SCALABILITY_PLAN.md §4.1): with Celery doing the heavy
    # OCR off-process, this pool only enqueues + polls (I/O-bound) and fires async
    # event saves — so it can exceed the old memory-bound cap of 2. Tune per host (P-4).
    core-pool-size: ${QC_EXECUTOR_CORE:4}
    max-pool-size: ${QC_EXECUTOR_MAX:8}
    queue-capacity: ${QC_EXECUTOR_QUEUE:200}
  reconciler:
    enabled: ${QC_RECONCILER_ENABLED:true}
    retry-after-minutes: ${QC_RECONCILER_RETRY_MINUTES:15}
    abandon-after-minutes: ${QC_RECONCILER_ABANDON_MINUTES:90}

management:
  endpoints:
    web:
      exposure:
        # Scaling Phase 0 (readme/SCALABILITY_PLAN.md): expose metrics + prometheus so
        # Hikari pool usage, JVM, and HTTP latency are observable for the load-test gates.
        # micrometer-registry-prometheus is already on the classpath (app/pom.xml).
        # SECURITY: /actuator must NOT be public in production — secure it in SecurityConfig
        # or bind a separate management port. Phase 6 wires Grafana/alerts on top of this.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: shal
  # Hikari, JVM, and HTTP server timings are auto-bound by Micrometer when actuator
  # is present — no extra code needed; they appear under /actuator/metrics.

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,Asia/Kolkata} %-5level ${PID:- } --- [%thread] %logger{40} : %msg%n"
  level:
    com.shal: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
